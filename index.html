<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly HVAC Maintenance Log — Abu Arish General Hospital</title>
<style>
/* ========== CSS VARIABLES ========== */
:root{
  --navy:#0F2A47;
  --steel:#2C5F8A;
  --light-blue:#DCE8F2;
  --gold:#B8860B;
  --green-bg:#D9F2E1;
  --green-text:#1E7145;
  --amber-bg:#FFF1CC;
  --amber-text:#B8860B;
  --red-bg:#FBE0E2;
  --red-text:#B23A48;
  --gray:#F4F6F8;
  --white:#FFFFFF;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --radius:6px;
  --transition:all 0.2s ease;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:"Segoe UI", system-ui, sans-serif;
  background:var(--gray);
  color:var(--navy);
  min-height:100vh;
  display:flex;
}

/* ========== SIDEBAR ========== */
.sidebar{
  width:240px;background:var(--navy);color:var(--white);
  display:flex;flex-direction:column;position:fixed;
  top:0;left:0;bottom:0;z-index:100;
}
.sidebar-logo{padding:20px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.1);}
.sidebar-logo img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:white;padding:3px;}
.sidebar-logo h3{font-size:14px;margin-top:8px;color:var(--light-blue);}
.sidebar-nav{flex:1;padding:15px 0;}
.sidebar-nav button{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:14px 20px;background:transparent;border:none;
  color:var(--light-blue);font-size:15px;cursor:pointer;
  transition:var(--transition);text-align:left;
}
.sidebar-nav button:hover{background:rgba(255,255,255,0.08);color:var(--white);}
.sidebar-nav button.active{background:var(--steel);color:var(--white);border-left:4px solid var(--gold);}
.sidebar-footer{padding:15px;border-top:1px solid rgba(255,255,255,0.1);font-size:11px;color:var(--light-blue);text-align:center;}

/* ========== MAIN ========== */
.main-content{flex:1;margin-left:240px;padding:20px;min-height:100vh;}

.app-header{
  background:var(--white);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
}
.app-header h1{font-size:22px;color:var(--navy);}
.app-header p{font-size:13px;color:var(--steel);}

.tab-content{display:none;}
.tab-content.active{display:block;animation:fadeIn 0.3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;}
.card-title{font-size:16px;font-weight:700;color:var(--steel);margin-bottom:15px;border-bottom:2px solid var(--light-blue);padding-bottom:10px;}

.btn{
  padding:10px 20px;border-radius:var(--radius);border:none;
  font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition);
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.btn-primary{background:var(--steel);color:var(--white);}
.btn-success{background:var(--green-text);color:var(--white);}
.btn-warning{background:var(--amber-text);color:var(--white);}
.btn-danger{background:var(--red-text);color:var(--white);}
.btn-outline{background:transparent;border:1px solid var(--steel);color:var(--steel);}

/* ========== FORM ========== */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px;}
.form-group label{display:block;font-weight:600;margin-bottom:5px;font-size:13px;color:var(--steel);}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px;border:1px solid #ccc;border-radius:var(--radius);
  font-size:14px;font-family:inherit;
}

/* ========== MONTHLY LOG GRID ========== */
.log-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.log-table th{
  background:var(--navy);color:var(--white);padding:8px 4px;
  text-align:center;font-size:11px;font-weight:600;border:1px solid #333;
}
.log-table td{
  border:1px solid #ccc;padding:0;text-align:center;height:36px;
  cursor:pointer;transition:background 0.15s ease;font-size:14px;
}
.log-table td:hover{background:var(--light-blue) !important;}
.log-table .item-col{
  text-align:right;padding:0 10px;font-size:12px;font-weight:600;
  background:var(--light-blue);cursor:default;white-space:nowrap;
}
.log-table .notes-col{
  min-width:120px;padding:0;
}
.log-table .notes-col input{
  width:100%;height:100%;border:none;padding:5px;font-size:11px;
  background:transparent;text-align:center;
}
.log-table .notes-col input:focus{outline:2px solid var(--steel);background:var(--white);}

.cell-empty{background:var(--white);}
.cell-ok{background:var(--green-bg);color:var(--green-text);font-weight:700;}
.cell-bad{background:var(--red-bg);color:var(--red-text);font-weight:700;}
.cell-na{background:var(--amber-bg);color:var(--amber-text);font-weight:700;}

/* ========== SIGNATURES ========== */
.signatures{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;margin-top:20px;
}
.signature-box{
  border-top:1px solid #000;padding-top:8px;text-align:center;
  font-size:13px;font-weight:600;
}

/* ========== ARCHIVE ========== */
.archive-table{width:100%;border-collapse:collapse;font-size:13px;}
.archive-table th{background:var(--navy);color:var(--white);padding:10px;text-align:left;font-size:12px;}
.archive-table td{padding:10px;border-bottom:1px solid #e0e0e0;}
.archive-table tr:nth-child(even){background:var(--gray);}

/* ========== MODAL ========== */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.5);z-index:1000;display:none;
  justify-content:center;align-items:center;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--white);border-radius:var(--radius);
  padding:25px;max-width:800px;width:90%;max-height:80vh;overflow-y:auto;
}

/* ========== TOAST ========== */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;}
.toast{background:var(--navy);color:var(--white);padding:14px 20px;border-radius:var(--radius);margin-top:10px;animation:slideIn 0.3s ease;font-size:14px;}
@keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ========== LEGEND ========== */
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:15px;font-size:12px;}
.legend span{display:flex;align-items:center;gap:5px;}
.legend-box{width:18px;height:18px;border:1px solid #ccc;border-radius:3px;display:inline-block;}

/* ========== PRINT ========== */
@media print{
  .sidebar,.app-header,.btn,.toast-container,#header-clock,.no-print{display:none !important;}
  .main-content{margin:0;padding:0;}
  body{background:white;}
  .card{box-shadow:none;border:none;padding:0;}
  @page{size:A4 landscape;margin:10mm;}
  .log-table th{font-size:9px;padding:5px 2px;}
  .log-table td{height:25px;font-size:11px;}
  .log-table .item-col{font-size:10px;padding:0 5px;}
}

/* ========== RESPONSIVE ========== */
@media(max-width:768px){
  .sidebar{width:100%;height:auto;position:fixed;bottom:0;top:auto;flex-direction:row;z-index:100;}
  .sidebar-logo{display:none;}
  .sidebar-nav{display:flex;padding:0;}
  .sidebar-nav button{flex:1;justify-content:center;padding:10px 5px;font-size:11px;flex-direction:column;gap:2px;}
  .sidebar-footer{display:none;}
  .main-content{margin-left:0;margin-bottom:60px;padding:10px;}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <img id="sidebar-logo-img" src="https://alhqyq.com/contents/newsm/18346_0.jpg" alt="Logo">
    <h3>Abu Arish General Hospital</h3>
  </div>
  <nav class="sidebar-nav">
    <button class="active" data-tab="log" onclick="switchTab('log')">📋 Monthly Log</button>
    <button data-tab="archive" onclick="switchTab('archive')">📁 Archive</button>
    <button data-tab="settings" onclick="switchTab('settings')">⚙ Settings</button>
  </nav>
  <div class="sidebar-footer">HVAC Engineering & Maintenance<br>Version 2.0 — 2026</div>
</aside>

<main class="main-content">
  <header class="app-header">
    <div>
      <h1>Monthly HVAC Maintenance Log</h1>
      <p>Engineering & Maintenance Department — Abu Arish General Hospital</p>
    </div>
    <div id="header-clock" style="font-size:14px;color:var(--steel);font-weight:600;"></div>
  </header>

  <div id="tab-log" class="tab-content active"><div id="log-container">Loading...</div></div>
  <div id="tab-archive" class="tab-content"><div id="archive-container">Loading...</div></div>
  <div id="tab-settings" class="tab-content"><div id="settings-container">Loading...</div></div>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>

<script>
/* ========== CORE APP ========== */
const App = {
  state: {
    currentTab: 'log',
    settings: {
      hospitalName: 'Abu Arish General Hospital',
      department: 'Engineering & Maintenance — HVAC Section',
      logo: 'https://alhqyq.com/contents/newsm/18346_0.jpg',
      version: '2.0',
      lastBackup: null
    },
    technicians: [
      'Najam-ud-Din Zakirullah',
      'Arshad Hussain Dilshad',
      'Mohammad Zafar Saleek',
      'Imam Bahai',
      'Danish',
      'Jaffar',
      'Mumtaz Afi Sheikh'
    ],
    units: [
      'I.C.U ROOM-PY100', 'I.C.U-CY240', 'I.C.U NEW-CTX025',
      'O.R-1-CTX050', 'O.R-2-CTX050', 'O.R CENTRAL-LDX040',
      'O.R-1 CORRIDOR-CTX030', 'MEDICAL GAS-CY100',
      'X-RAY-CY240', 'X-RAY-CY240 (2)', 'LAB-CTX040',
      'PHARMACY-PTX100', 'PHARMACY 1ST FL-PTX016',
      'OLD E.R-PRX050', 'F.M.E.R-PTX030', 'M.E.R-PTX030',
      'O.P.D NEW-CTX016', 'D.R NEW-CTX030', 'CSSD-CTX030',
      'PEDIA-PTX050', 'CORRIDOR-PS300', 'F.W-PRX050',
      'M.W-PRX050', 'DIRECTOR (NEW)-CTX070', 'LAUNDRY-CY300',
      'MEDICAL STORE (1)-PY340', 'MEDICAL STORE (2)-PY340',
      'MEDICAL STORE (3)-CTX030', 'MEDICAL STORE (4)-PY340'
    ],
    inspectionItems: [
      'Condenser Coils', 'Freon Leakage', 'Thermostat',
      'Compressor (1)', 'Compressor (2)', 'Contactor',
      'Condenser Fan Motor', 'Blower Motor', 'Blower Belt',
      'Filter Dryer', 'Pressure Switch LP/HP', 'Vibration Isolator',
      'Electrical Wiring', 'Duct Insulation', 'Unit Cleanliness',
      'Drainage System'
    ],
    currentMonth: new Date().getMonth(),
    currentYear: new Date().getFullYear(),
    currentUnit: '',
    currentGrid: {},   // { "unit|yyyy-mm": { "item|day": "ok|bad|na", "notes": {...}, "techSignature": "", "engSignature": "" } }
    activeRecord: null
  },

  db: {
    loadAll(){
      try{ return JSON.parse(localStorage.getItem('hvac_monthly_logs') || '{}'); }
      catch(e){ return {}; }
    },
    saveAll(data){
      try{ localStorage.setItem('hvac_monthly_logs', JSON.stringify(data)); return true; }
      catch(e){ showToast('⚠️ Save failed'); return false; }
    },
    loadSettings(){ try{ return JSON.parse(localStorage.getItem('hvac_monthly_settings') || '{}'); }catch(e){ return {}; } },
    saveSettings(s){ try{ localStorage.setItem('hvac_monthly_settings', JSON.stringify(s)); }catch(e){} },
    loadDraft(){ try{ return JSON.parse(localStorage.getItem('hvac_monthly_draft') || 'null'); }catch(e){ return null; } },
    saveDraft(d){ try{ localStorage.setItem('hvac_monthly_draft', JSON.stringify(d)); }catch(e){} },
    clearDraft(){ localStorage.removeItem('hvac_monthly_draft'); },
    exportJSON(){
      const data = {
        exportedAt: new Date().toISOString(),
        logs: this.loadAll(),
        settings: App.state.settings
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'MonthlyLog_Backup_' + new Date().toISOString().split('T')[0] + '.json';
      a.click(); URL.revokeObjectURL(url);
      showToast('✅ Backup exported');
    },
    importJSON(file){
      const reader = new FileReader();
      reader.onload = function(e){
        try{
          const data = JSON.parse(e.target.result);
          if(data.logs){
            localStorage.setItem('hvac_monthly_logs', JSON.stringify(data.logs));
            if(data.settings){ App.state.settings = {...App.state.settings, ...data.settings}; App.db.saveSettings(App.state.settings); }
            App.ui.renderArchive();
            showToast('✅ Backup imported');
          }
        }catch(err){ showToast('❌ Invalid file'); }
      };
      reader.readAsText(file);
    }
  },

  utils: {
    uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16); }); },
    getDaysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); },
    monthKey(unit, y, m){ return unit + '|' + y + '-' + String(m+1).padStart(2,'0'); },
    cycleCell(current){
      const order = ['', 'ok', 'bad', 'na'];
      const idx = order.indexOf(current || '');
      return order[(idx + 1) % order.length];
    },
    cellIcon(val){
      return val === 'ok' ? '✓' : val === 'bad' ? '✗' : val === 'na' ? 'N/A' : '';
    }
  }
};

/* ========== TAB SWITCH ========== */
function switchTab(tab){
  App.state.currentTab = tab;
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.sidebar-nav button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
  if(tab === 'log') App.ui.renderLog();
  if(tab === 'archive') App.ui.renderArchive();
  if(tab === 'settings') App.ui.renderSettings();
}

/* ========== TOAST ========== */
function showToast(msg){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  c.appendChild(t); setTimeout(()=>t.remove(), 3000);
}

/* ========== CLOCK ========== */
function updateClock(){
  document.getElementById('header-clock').textContent = new Date().toLocaleString('en-GB', {dateStyle:'full', timeStyle:'medium'});
}
setInterval(updateClock, 1000);

/* ========== MODAL ========== */
function openModal(html){
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('active');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('active'); }
document.getElementById('modal-overlay').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

/* ========== MONTHLY LOG UI ========== */
App.ui.renderLog = function(){
  const container = document.getElementById('log-container');
  const items = App.state.inspectionItems;
  const days = App.utils.getDaysInMonth(App.state.currentYear, App.state.currentMonth);
  const monthLabel = new Date(App.state.currentYear, App.state.currentMonth).toLocaleString('en-US', {month:'long', year:'numeric'});
  const key = App.utils.monthKey(App.state.currentUnit || '', App.state.currentYear, App.state.currentMonth);
  const savedData = App.db.loadAll()[key] || {cells:{}, notes:{}, techSignature:'', engSignature:''};

  // Draft restore
  const draft = App.db.loadDraft();
  if(draft){
    App.state.currentUnit = draft.currentUnit || '';
    App.state.currentMonth = draft.currentMonth ?? App.state.currentMonth;
    App.state.currentYear = draft.currentYear ?? App.state.currentYear;
    App.db.clearDraft();
  }

  const units = App.state.units;
  const techs = App.state.technicians;

  let html = `
  <div class="card">
    <div class="card-title">📋 Monthly Maintenance Log</div>

    <div class="form-grid">
      <div class="form-group">
        <label>Month</label>
        <input type="month" id="log-month" value="${App.state.currentYear}-${String(App.state.currentMonth+1).padStart(2,'0')}" onchange="onMonthChange(this.value)">
      </div>
      <div class="form-group">
        <label>AC Unit</label>
        <select id="log-unit" onchange="onUnitChange(this.value)">
          <option value="">-- Select Unit --</option>
          ${units.map(u => `<option value="${u}" ${u === App.state.currentUnit ? 'selected' : ''}>${u}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>Technician</label>
        <select id="log-tech" onchange="onTechChange(this.value)">
          <option value="">-- Select --</option>
          ${techs.map(t => `<option value="${t}" ${savedData.techSignature === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>Engineer</label>
        <select id="log-eng" onchange="onEngChange(this.value)">
          <option value="">-- Select --</option>
          <option value="Eng. Ahmad Ali Bokar Nasib" ${savedData.engSignature === 'Eng. Ahmad Ali Bokar Nasib' ? 'selected' : ''}>Eng. Ahmad Ali Bokar Nasib</option>
        </select>
      </div>
    </div>

    <div class="legend no-print">
      <span><span class="legend-box cell-ok"></span> ✓ OK</span>
      <span><span class="legend-box cell-bad"></span> ✗ Bad</span>
      <span><span class="legend-box cell-na"></span> N/A</span>
      <span><span class="legend-box cell-empty"></span> Empty (click to cycle)</span>
    </div>

    <p style="font-size:13px;color:var(--steel);margin-bottom:10px;">📅 ${monthLabel} — ${days} days</p>

    <div style="overflow-x:auto;">
    <table class="log-table" id="log-table">
      <thead>
        <tr>
          <th style="min-width:160px;">INSPECTION ITEM</th>
          ${Array.from({length:days}, (_,i) => `<th>${i+1}</th>`).join('')}
          <th style="min-width:130px;">NOTES</th>
        </tr>
      </thead>
      <tbody>
        ${items.map((item, idx) => `
          <tr>
            <td class="item-col">${item}</td>
            ${Array.from({length:days}, (_,d) => {
              const cellKey = `${idx}|${d}`;
              const val = savedData.cells[cellKey] || '';
              const cls = val === 'ok' ? 'cell-ok' : val === 'bad' ? 'cell-bad' : val === 'na' ? 'cell-na' : 'cell-empty';
              return `<td class="${cls}" data-idx="${idx}" data-day="${d}" onclick="cycleCell(this)">${App.utils.cellIcon(val)}</td>`;
            }).join('')}
            <td class="notes-col"><input type="text" data-notes-idx="${idx}" value="${savedData.notes[idx] || ''}" placeholder="..." oninput="onNotesChange(this)"></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>

    <div class="signatures no-print">
      <div class="signature-box" id="tech-signature-display">${savedData.techSignature || 'Technician Signature'}</div>
      <div class="signature-box" id="eng-signature-display">${savedData.engSignature || 'Engineer Signature'}</div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px;" class="no-print">
      <button class="btn btn-primary" onclick="printLog()">🖨️ Print</button>
      <button class="btn btn-success" onclick="saveLog()">💾 Save Log</button>
      <button class="btn btn-warning" onclick="resetGrid()">🔄 Reset Grid</button>
    </div>
  </div>`;

  container.innerHTML = html;
  App.state.currentKey = key;
  App.state.activeRecord = savedData;
};

function onMonthChange(val){
  const [y, m] = val.split('-').map(Number);
  App.state.currentYear = y;
  App.state.currentMonth = m - 1;
  saveDraft();
  App.ui.renderLog();
}

function onUnitChange(val){
  App.state.currentUnit = val;
  saveDraft();
  App.ui.renderLog();
}

function onTechChange(val){
  if(!App.state.activeRecord) return;
  App.state.activeRecord.techSignature = val;
  autoSaveGrid();
  document.getElementById('tech-signature-display').textContent = val || 'Technician Signature';
}

function onEngChange(val){
  if(!App.state.activeRecord) return;
  App.state.activeRecord.engSignature = val;
  autoSaveGrid();
  document.getElementById('eng-signature-display').textContent = val || 'Engineer Signature';
}

function cycleCell(td){
  const idx = parseInt(td.dataset.idx);
  const day = parseInt(td.dataset.day);
  const cellKey = `${idx}|${day}`;
  const current = App.state.activeRecord.cells[cellKey] || '';
  const next = App.utils.cycleCell(current);
  App.state.activeRecord.cells[cellKey] = next;
  td.className = next === 'ok' ? 'cell-ok' : next === 'bad' ? 'cell-bad' : next === 'na' ? 'cell-na' : 'cell-empty';
  td.textContent = App.utils.cellIcon(next);
  autoSaveGrid();
}

function onNotesChange(input){
  const idx = parseInt(input.dataset.notesIdx);
  App.state.activeRecord.notes[idx] = input.value;
  autoSaveGrid();
}

function autoSaveGrid(){
  if(!App.state.currentKey || !App.state.activeRecord) return;
  const allData = App.db.loadAll();
  allData[App.state.currentKey] = App.state.activeRecord;
  App.db.saveAll(allData);
}

function saveLog(){
  autoSaveGrid();
  showToast('✅ Log saved');
}

function resetGrid(){
  if(confirm('Clear entire grid?')){
    App.state.activeRecord.cells = {};
    App.state.activeRecord.notes = {};
    App.ui.renderLog();
    showToast('🔄 Grid reset');
  }
}

function saveDraft(){
  App.db.saveDraft({
    currentUnit: App.state.currentUnit,
    currentMonth: App.state.currentMonth,
    currentYear: App.state.currentYear
  });
}

/* ========== PRINT ========== */
function printLog(){
  const container = document.getElementById('log-container');
  const html = container.innerHTML;
  const logo = App.state.settings.logo;
  const printWin = window.open('', '_blank');
  printWin.document.write(`
    <html><head><title>Monthly Log</title>
    <style>
      body{font-family:Georgia,serif;color:#000;margin:0;padding:15px;}
      .print-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:15px;}

      table{width:100%;border-collapse:collapse;font-size:9px;}
      th{background:#eee;border:1px solid #000;padding:5px 2px;}
      td{border:1px solid #000;text-align:center;height:20px;}
      .item-col{text-align:right;padding:0 5px;font-size:8px;font-weight:600;background:#f0f0f0;}
      .cell-ok{background:#d9f2e1;color:#1e7145;font-weight:700;}
      .cell-bad{background:#fbe0e2;color:#b23a48;font-weight:700;}

      .sig-line{width:200px;border-top:1px solid #000;text-align:center;padding-top:5px;}
      @page{size:A4 landscape;margin:8mm;}
    </style></head><body>
      <div class="print-header">
        <img src="${logo}">
        <div style="text-align:center;">
          <h2 style="margin:0;">${App.state.settings.hospitalName}</h2>
          <p style="margin:3px 0;">${App.state.settings.department}</p>
          <h3 style="margin:0;">MONTHLY HVAC MAINTENANCE LOG</h3>
        </div>
        <div style="font-size:9px;">Unit: ${App.state.currentUnit || 'N/A'}<br>${new Date(App.state.currentYear, App.state.currentMonth).toLocaleString('en-US',{month:'long',year:'numeric'})}</div>
      </div>
      ${html.replace(/<div class="legend no-print">.*?<\/div>/s,'').replace(/<button.*?<\/button>/gs,'').replace(/<div style="display:flex;gap:10px;.*?<\/div>/s,'').replace(/<select.*?<\/select>/gs,'<span></span>').replace(/<input type="month".*?>/g,'')}
      <div class="signatures">
        <div class="sig-line">${App.state.activeRecord?.techSignature || 'Technician Signature'}</div>
        <div class="sig-line">${App.state.activeRecord?.engSignature || 'Engineer Signature'}</div>
      </div>
    </body></html>
  `);
  printWin.document.close();
  setTimeout(()=>printWin.print(), 500);
}

/* ========== ARCHIVE ========== */
App.ui.renderArchive = function(){
  const container = document.getElementById('archive-container');
  const allData = App.db.loadAll();
  const keys = Object.keys(allData);

  if(keys.length === 0){
    container.innerHTML = '<div class="card"><div class="card-title">📁 Archive</div><p style="text-align:center;color:var(--steel);padding:30px;">No saved logs.</p></div>';
    return;
  }

  let html = `
  <div class="card">
    <div class="card-title">📁 Archive — Saved Monthly Logs</div>
    <div class="no-print" style="margin-bottom:15px;display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="App.db.exportJSON()">⬇️ Export Backup</button>
      <input type="file" id="archive-import" accept=".json" style="display:none;" onchange="importArchive(this)">
      <button class="btn btn-outline" onclick="document.getElementById('archive-import').click()">⬆️ Import Backup</button>
    </div>
    <table class="archive-table">
      <thead><tr><th>Unit</th><th>Month</th><th>Technician</th><th>Engineer</th><th>Actions</th></tr></thead>
      <tbody>
        ${keys.map(k => {
          const r = allData[k];
          const [unit, month] = k.split('|');
          return `<tr>
            <td>${unit}</td>
            <td>${month}</td>
            <td>${r.techSignature || '—'}</td>
            <td>${r.engSignature || '—'}</td>
            <td>
              <button class="btn btn-outline" onclick="viewArchive('${k}')" style="padding:5px 10px;font-size:12px;">👁</button>
              <button class="btn btn-primary" onclick="printArchive('${k}')" style="padding:5px 10px;font-size:12px;">🖨</button>
              <button class="btn btn-danger" onclick="deleteArchive('${k}')" style="padding:5px 10px;font-size:12px;">🗑</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;

  container.innerHTML = html;
};

function importArchive(input){
  const file = input.files[0];
  if(file) App.db.importJSON(file);
}

function viewArchive(key){
  const allData = App.db.loadAll();
  const r = allData[key];
  if(!r) return;
  const items = App.state.inspectionItems;
  const [unit, month] = key.split('|');
  const days = App.utils.getDaysInMonth(parseInt(month.split('-')[0]), parseInt(month.split('-')[1]) - 1);

  let html = `
    <h3 style="color:var(--navy);margin-bottom:10px;">📋 Log Details</h3>
    <p><strong>Unit:</strong> ${unit} &nbsp;|&nbsp; <strong>Month:</strong> ${month}</p>
    <p><strong>Technician:</strong> ${r.techSignature || '—'} &nbsp;|&nbsp; <strong>Engineer:</strong> ${r.engSignature || '—'}</p>
    <div style="overflow-x:auto;margin-top:15px;">
    <table class="log-table">
      <thead><tr><th style="min-width:140px;">Item</th>${Array.from({length:days},(_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead>
      <tbody>
        ${items.map((item, idx) => `
          <tr>
            <td class="item-col">${item}</td>
            ${Array.from({length:days}, (_,d) => {
              const val = r.cells[`${idx}|${d}`] || '';
              const cls = val === 'ok' ? 'cell-ok' : val === 'bad' ? 'cell-bad' : val === 'na' ? 'cell-na' : 'cell-empty';
              return `<td class="${cls}">${App.utils.cellIcon(val)}</td>`;
            }).join('')}
          </tr>
        `).join('')}
      </tbody>
    </table></div>
    <button class="btn btn-primary" onclick="closeModal()" style="margin-top:15px;">Close</button>
  `;
  openModal(html);
}

function deleteArchive(key){
  if(confirm('Delete this log?')){
    const allData = App.db.loadAll();
    delete allData[key];
    App.db.saveAll(allData);
    showToast('🗑 Deleted');
    App.ui.renderArchive();
  }
}

function printArchive(key){
  // Set activeRecord and currentUnit for printing
  const allData = App.db.loadAll();
  const r = allData[key];
  const [unit, month] = key.split('|');
  App.state.currentUnit = unit;
  App.state.currentMonth = parseInt(month.split('-')[1]) - 1;
  App.state.currentYear = parseInt(month.split('-')[0]);
  App.state.activeRecord = r;
  App.state.currentKey = key;
  // Render log first then print
  App.ui.renderLog();
  setTimeout(()=>printLog(), 300);
}

/* ========== SETTINGS ========== */
App.ui.renderSettings = function(){
  const container = document.getElementById('settings-container');
  const s = App.state.settings;

  container.innerHTML = `
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;">

    <div class="card">
      <div class="card-title">🏥 Hospital Info</div>
      <label style="display:block;font-weight:600;margin-bottom:5px;">Hospital Name</label>
      <input type="text" id="set-hospital" value="${s.hospitalName}" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:var(--radius);margin-bottom:15px;">
      <label style="display:block;font-weight:600;margin-bottom:5px;">Department</label>
      <input type="text" id="set-department" value="${s.department}" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:var(--radius);margin-bottom:15px;">
      <button class="btn btn-primary" onclick="saveSettings()">💾 Save</button>
    </div>

    <div class="card">
      <div class="card-title">👨‍🔧 Technicians</div>
      <div id="tech-list">
        ${App.state.technicians.map((t,i) => `
          <div style="display:flex;gap:5px;margin-bottom:5px;">
            <input type="text" value="${t}" onchange="updateTech(${i},this.value)" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:var(--radius);">
            <button class="btn btn-danger" onclick="deleteTech(${i})" style="padding:8px 12px;">🗑</button>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-outline" onclick="addTech()" style="margin-top:10px;">➕ Add Technician</button>
    </div>

    <div class="card">
      <div class="card-title">❄️ AC Units</div>
      <div id="unit-list">
        ${App.state.units.map((u,i) => `
          <div style="display:flex;gap:5px;margin-bottom:5px;">
            <input type="text" value="${u}" onchange="updateUnit(${i},this.value)" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:var(--radius);">
            <button class="btn btn-danger" onclick="deleteUnit(${i})" style="padding:8px 12px;">🗑</button>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-outline" onclick="addUnit()" style="margin-top:10px;">➕ Add Unit</button>
    </div>

    <div class="card">
      <div class="card-title">🔧 Inspection Items</div>
      <div id="item-list">
        ${App.state.inspectionItems.map((it,i) => `
          <div style="display:flex;gap:5px;margin-bottom:5px;">
            <input type="text" value="${it}" onchange="updateItem(${i},this.value)" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:var(--radius);">
            <button class="btn btn-danger" onclick="deleteItem(${i})" style="padding:8px 12px;">🗑</button>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-outline" onclick="addItem()" style="margin-top:10px;">➕ Add Item</button>
    </div>

    <div class="card">
      <div class="card-title">💾 Data Management</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-primary" onclick="App.db.exportJSON()">⬇️ Export Backup (JSON)</button>
        <button class="btn btn-danger" onclick="confirmClearAll()">🗑 Clear All Data</button>
      </div>
    </div>

  </div>`;

  container.innerHTML = html;
};

function saveSettings(){
  App.state.settings.hospitalName = document.getElementById('set-hospital').value;
  App.state.settings.department = document.getElementById('set-department').value;
  App.state.settings.lastBackup = new Date().toISOString();
  App.db.saveSettings(App.state.settings);
  showToast('✅ Settings saved');
}

function updateTech(idx, val){ App.state.technicians[idx] = val; saveTechs(); }
function deleteTech(idx){ App.state.technicians.splice(idx, 1); saveTechs(); App.ui.renderSettings(); }
function addTech(){ App.state.technicians.push('New Tech'); saveTechs(); App.ui.renderSettings(); }
function saveTechs(){ localStorage.setItem('hvac_monthly_techs', JSON.stringify(App.state.technicians)); }

function updateUnit(idx, val){ App.state.units[idx] = val; saveUnits(); }
function deleteUnit(idx){ App.state.units.splice(idx, 1); saveUnits(); App.ui.renderSettings(); }
function addUnit(){ App.state.units.push('New Unit'); saveUnits(); App.ui.renderSettings(); }
function saveUnits(){ localStorage.setItem('hvac_monthly_units', JSON.stringify(App.state.units)); }

function updateItem(idx, val){ App.state.inspectionItems[idx] = val; saveItems(); }
function deleteItem(idx){ App.state.inspectionItems.splice(idx, 1); saveItems(); App.ui.renderSettings(); }
function addItem(){ App.state.inspectionItems.push('New Item'); saveItems(); App.ui.renderSettings(); }
function saveItems(){ localStorage.setItem('hvac_monthly_items', JSON.stringify(App.state.inspectionItems)); }

function confirmClearAll(){
  if(confirm('⚠️ Delete ALL data? This cannot be undone.')){
    localStorage.removeItem('hvac_monthly_logs');
    localStorage.removeItem('hvac_monthly_draft');
    showToast('🗑 All data cleared');
    App.ui.renderArchive();
  }
}

/* ========== INIT ========== */
function initApp(){
  // Load settings
  const saved = App.db.loadSettings();
  if(Object.keys(saved).length) App.state.settings = {...App.state.settings, ...saved};

  // Load custom lists
  const techs = JSON.parse(localStorage.getItem('hvac_monthly_techs') || 'null');
  if(techs) App.state.technicians = techs;
  const units = JSON.parse(localStorage.getItem('hvac_monthly_units') || 'null');
  if(units) App.state.units = units;
  const items = JSON.parse(localStorage.getItem('hvac_monthly_items') || 'null');
  if(items) App.state.inspectionItems = items;

  // Restore draft
  const draft = App.db.loadDraft();
  if(draft){
    App.state.currentUnit = draft.currentUnit || '';
    App.state.currentMonth = draft.currentMonth ?? App.state.currentMonth;
    App.state.currentYear = draft.currentYear ?? App.state.currentYear;
    App.db.clearDraft();
  }

  updateClock();
  App.ui.renderLog();
}

initApp();
</script>
