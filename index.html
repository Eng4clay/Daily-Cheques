<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC Monthly Log</title>
<style>
:root{--navy:#0F2A47;--steel:#2C5F8A;--light-blue:#DCE8F2;--gold:#B8860B;--green-bg:#D9F2E1;--green-text:#1E7145;--amber-bg:#FFF1CC;--amber-text:#B8860B;--red-bg:#FBE0E2;--red-text:#B23A48;--gray:#F4F6F8;--white:#FFF;--shadow:0 2px 8px rgba(0,0,0,.08);--radius:6px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--gray);color:var(--navy);min-height:100vh;display:flex}
.sidebar{width:220px;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;padding:20px}
.sidebar h3{text-align:center;margin-bottom:20px;font-size:16px;color:var(--light-blue)}
.sidebar button{display:block;width:100%;padding:14px;background:transparent;border:none;color:var(--light-blue);font-size:15px;cursor:pointer;text-align:left;margin-bottom:5px;border-radius:var(--radius)}
.sidebar button.active{background:var(--steel);color:#fff}
.main-content{flex:1;margin-left:220px;padding:20px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card-title{font-size:18px;font-weight:700;color:var(--steel);margin-bottom:15px;border-bottom:2px solid var(--light-blue);padding-bottom:10px}
.btn{padding:10px 20px;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;margin-right:10px}
.btn-success{background:var(--green-text);color:#fff}.btn-primary{background:var(--steel);color:#fff}.btn-warning{background:var(--amber-text);color:#fff}.btn-danger{background:var(--red-text);color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.form-grid label{font-weight:600;font-size:13px;color:var(--steel);display:block;margin-bottom:5px}
.form-grid select,.form-grid input{width:100%;padding:10px;border:1px solid #ccc;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--navy);color:#fff;padding:8px;border:1px solid #333;text-align:center}
td{border:1px solid #ccc;text-align:center;height:34px;cursor:pointer}
.item-col{text-align:right;padding:0 8px;font-weight:600;background:var(--light-blue);cursor:default;white-space:nowrap}
.cell-ok{background:var(--green-bg);color:var(--green-text);font-weight:700}
.cell-bad{background:var(--red-bg);color:var(--red-text);font-weight:700}
.cell-na{background:var(--amber-bg);color:var(--amber-text);font-weight:700}
.notes-input{width:100%;height:100%;border:none;padding:3px;font-size:10px;background:transparent;text-align:center}
.general-notes{margin-top:15px}
.general-notes textarea{width:100%;min-height:70px;padding:10px;border:2px dashed #ccc;border-radius:var(--radius)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:15px 25px;border-radius:var(--radius);z-index:9999;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.archive-table{width:100%;border-collapse:collapse}
.archive-table th{background:var(--navy);color:#fff;padding:10px;text-align:left}
.archive-table td{padding:10px;border-bottom:1px solid #ddd}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:25px;max-width:900px;width:95%;max-height:85vh;overflow:auto}
</style>
</head>
<body>

<div class="sidebar">
  <h3>🏥 HVAC Log</h3>
  <button class="active" onclick="switchTab('log')">📋 Monthly Log</button>
  <button onclick="switchTab('archive')">📁 Archive</button>
  <button onclick="switchTab('settings')">⚙ Settings</button>
</div>

<div class="main-content">
  <div id="tab-log">
    <div class="card">
      <div class="card-title">📋 Monthly Maintenance Log</div>
      <div class="form-grid">
        <div><label>Month</label><input type="month" id="f-month" onchange="onMonthChange()"></div>
        <div><label>AC Unit</label><select id="f-unit" onchange="onUnitChange()"><option value="">-- Select --</option></select></div>
        <div><label>Technician</label><select id="f-tech" onchange="onTechChange()"><option value="">-- Select --</option></select></div>
        <div><label>Engineer</label><select id="f-eng" onchange="onEngChange()"><option value="">-- Select --</option><option>Eng. Ahmad Ali Bokar Nasib</option></select></div>
      </div>
      <div id="table-container"></div>
      <div class="general-notes">
        <label><strong>📝 General Notes</strong></label>
        <textarea id="f-notes" oninput="onGeneralNotes(this)"></textarea>
      </div>
      <div style="margin-top:15px;">
        <button class="btn btn-success" onclick="saveLog()">💾 Save</button>
        <button class="btn btn-primary" onclick="printLog()">🖨️ Print</button>
        <button class="btn btn-warning" onclick="resetGrid()">🔄 Reset</button>
      </div>
    </div>
  </div>
  <div id="tab-archive" style="display:none;"></div>
  <div id="tab-settings" style="display:none;"></div>
</div>

<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>

<script>
// بيانات ثابتة
const UNITS = ['I.C.U ROOM-PY100','I.C.U-CY240','I.C.U NEW-CTX025','O.R-1-CTX050','O.R-2-CTX050','O.R CENTRAL-LDX040','O.R-1 CORRIDOR-CTX030','MEDICAL GAS-CY100','X-RAY-CY240','X-RAY-CY240 (2)','LAB-CTX040','PHARMACY-PTX100','PHARMACY 1ST FL-PTX016','OLD E.R-PRX050','F.M.E.R-PTX030','M.E.R-PTX030','O.P.D NEW-CTX016','D.R NEW-CTX030','CSSD-CTX030','PEDIA-PTX050','CORRIDOR-PS300','F.W-PRX050','M.W-PRX050','DIRECTOR (NEW)-CTX070','LAUNDRY-CY300','MEDICAL STORE (1)-PY340','MEDICAL STORE (2)-PY340','MEDICAL STORE (3)-CTX030','MEDICAL STORE (4)-PY340'];
const TECHS = ['Najam-ud-Din Zakirullah','Arshad Hussain Dilshad','Mohammad Zafar Saleek','Imam Bahai','Danish','Jaffar','Mumtaz Afi Sheikh'];
const ITEMS = ['Condenser Coils','Freon Leakage','Thermostat','Compressor (1)','Compressor (2)','Contactor','Condenser Fan Motor','Blower Motor','Blower Belt','Filter Dryer','Pressure Switch LP/HP','Vibration Isolator','Electrical Wiring','Duct Insulation','Unit Cleanliness','Drainage System'];
const CYCLE = ['', 'ok', 'bad', 'na'];
const ICONS = {ok:'✓', bad:'✗', na:'N/A'};

let currentUnit = '';
let currentTech = '';
let currentEng = '';
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let currentCells = {};
let currentNotes = {};
let generalNotesText = '';

function init(){
  const now = new Date();
  currentMonth = now.getMonth();
  currentYear = now.getFullYear();
  document.getElementById('f-month').value = currentYear + '-' + String(currentMonth+1).padStart(2,'0');
  const unitSel = document.getElementById('f-unit');
  UNITS.forEach(u => unitSel.innerHTML += `<option>${u}</option>`);
  const techSel = document.getElementById('f-tech');
  TECHS.forEach(t => techSel.innerHTML += `<option>${t}</option>`);
  renderTable();
}

function renderTable(){
  const days = new Date(currentYear, currentMonth+1, 0).getDate();
  const key = `${currentUnit}|${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  const saved = JSON.parse(localStorage.getItem('hvac_logs') || '{}');
  const record = saved[key] || {};
  currentCells = record.cells || {};
  currentNotes = record.notes || {};
  generalNotesText = record.generalNotes || '';
  currentTech = record.tech || '';
  currentEng = record.eng || '';
  document.getElementById('f-tech').value = currentTech;
  document.getElementById('f-eng').value = currentEng;
  document.getElementById('f-notes').value = generalNotesText;

  let html = `<table><thead><tr><th>ITEM</th>`;
  for(let d=1; d<=days; d++) html += `<th>${d}</th>`;
  html += `<th>NOTES</th></tr></thead><tbody>`;
  ITEMS.forEach((item, idx) => {
    html += `<tr><td class="item-col">${item}</td>`;
    for(let d=0; d<days; d++){
      const ck = `${idx}|${d}`;
      const val = currentCells[ck] || '';
      const cls = val==='ok'?'cell-ok':val==='bad'?'cell-bad':val==='na'?'cell-na':'';
      html += `<td class="${cls}" onclick="cycleCell(this,'${ck}')">${ICONS[val]||''}</td>`;
    }
    html += `<td><input class="notes-input" value="${currentNotes[idx]||''}" oninput="noteChange(this,'${idx}')"></td></tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById('table-container').innerHTML = html;
}

function cycleCell(td, ck){
  const cur = currentCells[ck] || '';
  const nextIdx = (CYCLE.indexOf(cur) + 1) % CYCLE.length;
  const next = CYCLE[nextIdx];
  currentCells[ck] = next;
  td.className = next==='ok'?'cell-ok':next==='bad'?'cell-bad':next==='na'?'cell-na':'';
  td.textContent = ICONS[next]||'';
}

function noteChange(input, idx){
  currentNotes[idx] = input.value;
}

function onGeneralNotes(ta){
  generalNotesText = ta.value;
}

function onMonthChange(){
  const v = document.getElementById('f-month').value;
  if(v){ const [y,m] = v.split('-').map(Number); currentYear=y; currentMonth=m-1; renderTable(); }
}

function onUnitChange(){
  currentUnit = document.getElementById('f-unit').value;
  renderTable();
}

function onTechChange(){
  currentTech = document.getElementById('f-tech').value;
}

function onEngChange(){
  currentEng = document.getElementById('f-eng').value;
}

function saveLog(){
  if(!currentUnit){ alert('⚠️ Please select AC Unit first'); return; }
  const key = `${currentUnit}|${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  const all = JSON.parse(localStorage.getItem('hvac_logs') || '{}');
  all[key] = {
    cells: currentCells,
    notes: currentNotes,
    generalNotes: generalNotesText,
    tech: currentTech,
    eng: currentEng
  };
  localStorage.setItem('hvac_logs', JSON.stringify(all));
  showToast('✅ Log saved successfully');
  renderArchive();
}

function resetGrid(){
  if(confirm('Clear entire grid?')){
    currentCells = {};
    currentNotes = {};
    generalNotesText = '';
    document.getElementById('f-notes').value = '';
    renderTable();
    showToast('🔄 Grid reset');
  }
}

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

function printLog(){
  const days = new Date(currentYear, currentMonth+1, 0).getDate();
  let w = window.open('', '_blank');
  let html = `<html><head><title>Print</title><style>body{font-family:Georgia;padding:15px}table{border-collapse:collapse;font-size:9px;width:100%}th,td{border:1px solid #000;padding:3px;text-align:center}.item-col{text-align:right;font-weight:bold}@page{size:A4 landscape;margin:8mm}</style></head><body>`;
  html += `<h2>Monthly HVAC Maintenance Log</h2><p>Unit: ${currentUnit} | Month: ${currentYear}-${String(currentMonth+1).padStart(2,'0')} | Tech: ${currentTech} | Eng: ${currentEng}</p>`;
  html += `<table><thead><tr><th>ITEM</th>`;
  for(let d=1; d<=days; d++) html += `<th>${d}</th>`;
  html += `<th>NOTES</th></tr></thead><tbody>`;
  ITEMS.forEach((item, idx) => {
    html += `<tr><td class="item-col">${item}</td>`;
    for(let d=0; d<days; d++){
      const ck = `${idx}|${d}`;
      const val = currentCells[ck]||'';
      html += `<td>${ICONS[val]||''}</td>`;
    }
    html += `<td>${currentNotes[idx]||''}</td></tr>`;
  });
  html += `</tbody></table><p><strong>General Notes:</strong> ${generalNotesText||'—'}</p>`;
  html += `<p>Technician: ${currentTech} &nbsp;|&nbsp; Engineer: ${currentEng}</p>`;
  html += `</body></html>`;
  w.document.write(html);
  w.document.close();
  setTimeout(()=>w.print(), 500);
}

function switchTab(tab){
  document.getElementById('tab-log').style.display = tab==='log' ? 'block' : 'none';
  document.getElementById('tab-archive').style.display = tab==='archive' ? 'block' : 'none';
  document.getElementById('tab-settings').style.display = tab==='settings' ? 'block' : 'none';
  document.querySelectorAll('.sidebar button').forEach((b,i)=>{
    b.classList.remove('active');
    if((tab==='log'&&i===0)||(tab==='archive'&&i===1)||(tab==='settings'&&i===2)) b.classList.add('active');
  });
  if(tab==='archive') renderArchive();
  if(tab==='settings') renderSettings();
}

function renderArchive(){
  const all = JSON.parse(localStorage.getItem('hvac_logs') || '{}');
  const keys = Object.keys(all);
  let html = `<div class="card"><div class="card-title">📁 Archive</div>`;
  if(keys.length===0){
    html += `<p>No saved logs.</p></div>`;
  } else {
    html += `<table class="archive-table"><thead><tr><th>Unit</th><th>Month</th><th>Tech</th><th>Eng</th><th>Actions</th></tr></thead><tbody>`;
    keys.forEach(k=>{
      const r = all[k];
      const [unit, month] = k.split('|');
      html += `<tr><td>${unit}</td><td>${month}</td><td>${r.tech||'—'}</td><td>${r.eng||'—'}</td><td>`;
      html += `<button class="btn btn-primary" onclick="viewLog('${k}')">👁 View</button> `;
      html += `<button class="btn btn-danger" onclick="deleteLog('${k}')">🗑</button></td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  document.getElementById('tab-archive').innerHTML = html;
}

function viewLog(k){
  const all = JSON.parse(localStorage.getItem('hvac_logs') || '{}');
  const r = all[k];
  if(!r) return;
  const [unit, month] = k.split('|');
  const days = new Date(parseInt(month.split('-')[0]), parseInt(month.split('-')[1]), 0).getDate();
  let html = `<h3>📋 Log Details</h3><p><strong>Unit:</strong> ${unit} | <strong>Month:</strong> ${month}</p>`;
  html += `<p><strong>Technician:</strong> ${r.tech||'—'} | <strong>Engineer:</strong> ${r.eng||'—'}</p>`;
  html += `<table><thead><tr><th>ITEM</th>`;
  for(let d=1; d<=days; d++) html += `<th>${d}</th>`;
  html += `</tr></thead><tbody>`;
  ITEMS.forEach((item, idx)=>{
    html += `<tr><td class="item-col">${item}</td>`;
    for(let d=0; d<days; d++){
      const ck = `${idx}|${d}`;
      const val = (r.cells||{})[ck]||'';
      const cls = val==='ok'?'cell-ok':val==='bad'?'cell-bad':val==='na'?'cell-na':'';
      html += `<td class="${cls}">${ICONS[val]||''}</td>`;
    }
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  if(r.generalNotes) html += `<p><strong>General Notes:</strong> ${r.generalNotes}</p>`;
  html += `<button class="btn btn-primary" onclick="closeModal()">Close</button>`;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('active');
}

function deleteLog(k){
  if(confirm('Delete this log?')){
    const all = JSON.parse(localStorage.getItem('hvac_logs') || '{}');
    delete all[k];
    localStorage.setItem('hvac_logs', JSON.stringify(all));
    renderArchive();
  }
}

function closeModal(){ document.getElementById('modal-overlay').classList.remove('active'); }

function renderSettings(){
  document.getElementById('tab-settings').innerHTML = `<div class="card"><div class="card-title">⚙ Settings</div><p>This version uses local storage (works offline).</p></div>`;
}

document.getElementById('modal-overlay').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

init();
</script>
</body>
</html>
