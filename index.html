<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC Monthly Maintenance Log — Cloud Sync</title>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

<style>
/* ==== نفس الـ CSS السابق بالكامل ==== */
:root{--navy:#0F2A47;--steel:#2C5F8A;--light-blue:#DCE8F2;--gold:#B8860B;--green-bg:#D9F2E1;--green-text:#1E7145;--amber-bg:#FFF1CC;--amber-text:#B8860B;--red-bg:#FBE0E2;--red-text:#B23A48;--gray:#F4F6F8;--white:#FFFFFF;--shadow:0 2px 8px rgba(0,0,0,0.08);--radius:6px;--transition:all .2s ease}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--gray);color:var(--navy);min-height:100vh;display:flex}
.sidebar{width:240px;background:var(--navy);color:var(--white);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:width .25s ease}
.sidebar-toggle{position:absolute;top:12px;right:12px;background:var(--steel);color:#fff;border:2px solid var(--gold);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;z-index:101}
.sidebar-logo{padding:20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#fff;padding:3px}
.sidebar-logo h3{font-size:14px;margin-top:8px;color:var(--light-blue)}
.sidebar-nav{flex:1;padding:15px 0}
.sidebar-nav button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;background:transparent;border:none;color:var(--light-blue);font-size:15px;cursor:pointer;text-align:left}
.sidebar-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar-nav button.active{background:var(--steel);color:#fff;border-left:4px solid var(--gold)}
.sidebar-nav button .nav-icon{font-size:18px;min-width:24px;text-align:center}
.sidebar-footer{padding:15px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:var(--light-blue);text-align:center}
.sidebar.collapsed{width:60px}
.sidebar.collapsed .sidebar-logo,.sidebar.collapsed .sidebar-footer{display:none}
.sidebar.collapsed .sidebar-nav button .nav-label{display:none}
.sidebar.collapsed .sidebar-nav button{justify-content:center;padding:14px 0}
.main-content{flex:1;margin-left:240px;padding:20px;min-height:100vh;transition:margin-left .25s ease}
.main-content.expanded{margin-left:60px}
.app-header{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.app-header h1{font-size:22px;color:var(--navy)}.app-header p{font-size:13px;color:var(--steel)}
.tab-content{display:none}.tab-content.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card-title{font-size:16px;font-weight:700;color:var(--steel);margin-bottom:15px;border-bottom:2px solid var(--light-blue);padding-bottom:10px}
.btn{padding:10px 20px;border-radius:var(--radius);border:none;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--steel);color:#fff}.btn-success{background:var(--green-text);color:#fff}.btn-warning{background:var(--amber-text);color:#fff}.btn-danger{background:var(--red-text);color:#fff}.btn-outline{background:transparent;border:1px solid var(--steel);color:var(--steel)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.form-group label{display:block;font-weight:600;margin-bottom:5px;font-size:13px;color:var(--steel)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:var(--radius);font-size:14px}
.log-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.log-table th{background:var(--navy);color:#fff;padding:8px 4px;text-align:center;font-size:11px;border:1px solid #333}
.log-table td{border:1px solid #ccc;padding:0;text-align:center;height:36px;cursor:pointer;font-size:14px}
.log-table .item-col{text-align:right;padding:0 10px;font-size:12px;font-weight:600;background:var(--light-blue);cursor:default;white-space:nowrap}
.log-table .notes-col{min-width:120px;padding:0}
.log-table .notes-col input{width:100%;height:100%;border:none;padding:5px;font-size:11px;text-align:center;background:transparent}
.cell-empty{background:#fff}.cell-ok{background:var(--green-bg);color:var(--green-text);font-weight:700}.cell-bad{background:var(--red-bg);color:var(--red-text);font-weight:700}.cell-na{background:var(--amber-bg);color:var(--amber-text);font-weight:700}
.signatures{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:20px}
.signature-box{border-top:1px solid #000;padding-top:8px;text-align:center;font-size:13px;font-weight:600}
.general-notes{margin-top:20px}
.general-notes textarea{width:100%;min-height:80px;padding:12px;border:2px dashed #ccc;border-radius:var(--radius);font-size:14px}
.archive-table{width:100%;border-collapse:collapse;font-size:13px}
.archive-table th{background:var(--navy);color:#fff;padding:10px;text-align:left;font-size:12px}
.archive-table td{padding:10px;border-bottom:1px solid #e0e0e0}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.kpi-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center}
.kpi-card h2{font-size:30px;color:var(--navy)}
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.unit-card{padding:12px;border-radius:var(--radius);border:2px solid #e0e0e0;background:#fff}
.unit-card.green{border-color:var(--green-text)}.unit-card.amber{border-color:var(--amber-text)}.unit-card.red{border-color:var(--red-text)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:none;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}.modal{background:#fff;border-radius:var(--radius);padding:25px;max-width:800px;width:90%;max-height:80vh;overflow-y:auto}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999}
.toast{background:var(--navy);color:#fff;padding:14px 20px;border-radius:var(--radius);margin-top:10px;animation:slideIn .3s ease;font-size:14px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:15px;font-size:12px}
.legend-box{width:18px;height:18px;border:1px solid #ccc;border-radius:3px;display:inline-block}
@media print{.sidebar,.app-header,.btn,.toast-container,#header-clock,.no-print,.sidebar-toggle{display:none!important}.main-content{margin:0;padding:0}body{background:#fff}.card{box-shadow:none;border:none;padding:0}@page{size:A4 landscape;margin:10mm}.log-table th{font-size:9px;padding:5px 2px}.log-table td{height:25px;font-size:11px}.log-table .item-col{font-size:10px;padding:0 5px}}
@media(max-width:768px){.sidebar{width:100%;height:auto;position:fixed;bottom:0;top:auto;flex-direction:row}.sidebar-logo,.sidebar-footer{display:none}.sidebar-nav{display:flex;padding:0}.sidebar-nav button{flex:1;justify-content:center;padding:10px 5px;font-size:11px;flex-direction:column}.main-content{margin-left:0;margin-bottom:60px;padding:10px}.main-content.expanded{margin-left:0}}
</style>
</head>
<body>

<!-- نفس هيكل الـ Body مع التعديلات -->
<aside class="sidebar" id="sidebar">
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-logo">
    <img id="sidebar-logo-img" src="https://alhqyq.com/contents/newsm/18346_0.jpg" alt="Logo">
    <h3>Abu Arish General Hospital</h3>
  </div>
  <nav class="sidebar-nav">
    <button class="active" data-tab="log" onclick="switchTab('log')"><span class="nav-icon">📋</span><span class="nav-label">Monthly Log</span></button>
    <button data-tab="archive" onclick="switchTab('archive')"><span class="nav-icon">📁</span><span class="nav-label">Archive</span></button>
    <button data-tab="dashboard" onclick="switchTab('dashboard')"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></button>
    <button data-tab="settings" onclick="switchTab('settings')"><span class="nav-icon">⚙</span><span class="nav-label">Settings</span></button>
  </nav>
  <div class="sidebar-footer">HVAC Engineering & Maintenance<br>Version 4.1 — Fixed</div>
</aside>

<main class="main-content" id="main-content">
  <header class="app-header">
    <div><h1>HVAC Monthly Maintenance Log</h1><p>Engineering & Maintenance — Abu Arish General Hospital</p></div>
    <div id="header-clock" style="font-size:14px;color:var(--steel);font-weight:600;"></div>
  </header>
  <div id="tab-log" class="tab-content active"><div id="log-container">Loading...</div></div>
  <div id="tab-archive" class="tab-content"><div id="archive-container">Loading...</div></div>
  <div id="tab-dashboard" class="tab-content"><div id="dashboard-container">Loading...</div></div>
  <div id="tab-settings" class="tab-content"><div id="settings-container">Loading...</div></div>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>

<script>
/* ========== FIREBASE CONFIG ========== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDZpM6FTMaJNpG6HUL7Mag66smEt7IyJSo",
  authDomain: "hvac-abuarish-a3940.firebaseapp.com",
  databaseURL: "https://hvac-abuarish-a3940-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hvac-abuarish-a3940",
  storageBucket: "hvac-abuarish-a3940.firebasestorage.app",
  messagingSenderId: "817940058987",
  appId: "1:817940058987:web:6e45990789439101ba722e"
};

let firebaseDB = null;
let firebaseConnected = false;
try { firebase.initializeApp(FIREBASE_CONFIG); firebaseDB = firebase.database(); firebaseConnected = true; } catch(e) { console.warn(e); }

/* ========== CORE ========== */
var App = {
  state: {
    currentTab:'log',
    settings:{hospitalName:'Abu Arish General Hospital',department:'Engineering & Maintenance — HVAC Section',logo:'https://alhqyq.com/contents/newsm/18346_0.jpg',version:'4.1'},
    technicians:['Najam-ud-Din Zakirullah','Arshad Hussain Dilshad','Mohammad Zafar Saleek','Imam Bahai','Danish','Jaffar','Mumtaz Afi Sheikh'],
    units:['I.C.U ROOM-PY100','I.C.U-CY240','I.C.U NEW-CTX025','O.R-1-CTX050','O.R-2-CTX050','O.R CENTRAL-LDX040','O.R-1 CORRIDOR-CTX030','MEDICAL GAS-CY100','X-RAY-CY240','X-RAY-CY240 (2)','LAB-CTX040','PHARMACY-PTX100','PHARMACY 1ST FL-PTX016','OLD E.R-PRX050','F.M.E.R-PTX030','M.E.R-PTX030','O.P.D NEW-CTX016','D.R NEW-CTX030','CSSD-CTX030','PEDIA-PTX050','CORRIDOR-PS300','F.W-PRX050','M.W-PRX050','DIRECTOR (NEW)-CTX070','LAUNDRY-CY300','MEDICAL STORE (1)-PY340','MEDICAL STORE (2)-PY340','MEDICAL STORE (3)-CTX030','MEDICAL STORE (4)-PY340'],
    inspectionItems:['Condenser Coils','Freon Leakage','Thermostat','Compressor (1)','Compressor (2)','Contactor','Condenser Fan Motor','Blower Motor','Blower Belt','Filter Dryer','Pressure Switch LP/HP','Vibration Isolator','Electrical Wiring','Duct Insulation','Unit Cleanliness','Drainage System'],
    currentMonth:new Date().getMonth(), currentYear:new Date().getFullYear(),
    currentUnit:'', activeRecord:null, currentKey:''
  },
  db:{
    loadAll:function(){ if(firebaseConnected && firebaseDB){ return firebaseDB.ref('logs').once('value').then(function(s){ var d=s.val()||{}; localStorage.setItem('hvac_monthly_logs',JSON.stringify(d)); return d; }).catch(function(){ return JSON.parse(localStorage.getItem('hvac_monthly_logs')||'{}'); }); } else { return Promise.resolve(JSON.parse(localStorage.getItem('hvac_monthly_logs')||'{}')); } },
    saveAll:function(data){ localStorage.setItem('hvac_monthly_logs',JSON.stringify(data)); if(firebaseConnected && firebaseDB){ firebaseDB.ref('logs').set(data).then(function(){showToast('☁️ Synced');}).catch(function(){showToast('⚠️ Local only');}); } },
    loadSettings:function(){ try{return JSON.parse(localStorage.getItem('hvac_monthly_settings')||'{}');}catch(e){return {};} },
    saveSettings:function(s){ try{localStorage.setItem('hvac_monthly_settings',JSON.stringify(s));}catch(e){} },
    loadDraft:function(){ try{return JSON.parse(localStorage.getItem('hvac_monthly_draft')||'null');}catch(e){return null;} },
    saveDraft:function(d){ try{localStorage.setItem('hvac_monthly_draft',JSON.stringify(d));}catch(e){} },
    clearDraft:function(){ localStorage.removeItem('hvac_monthly_draft'); },
    exportJSON:function(){ var data={logs:JSON.parse(localStorage.getItem('hvac_monthly_logs')||'{}'),settings:App.state.settings}; var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='Backup_'+new Date().toISOString().split('T')[0]+'.json'; a.click(); URL.revokeObjectURL(url); },
    importJSON:function(file){ var r=new FileReader(); r.onload=function(e){ try{ var data=JSON.parse(e.target.result); if(data.logs){ localStorage.setItem('hvac_monthly_logs',JSON.stringify(data.logs)); if(firebaseConnected){firebaseDB.ref('logs').set(data.logs);} App.ui.renderArchive(); showToast('✅ Imported'); } }catch(err){showToast('❌ Invalid');} }; r.readAsText(file); }
  },
  utils:{
    getDaysInMonth:function(y,m){return new Date(y,m+1,0).getDate();},
    monthKey:function(u,y,m){return u+'|'+y+'-'+('0'+(m+1)).slice(-2);},
    cycleCell:function(c){var o=['','ok','bad','na'];var i=o.indexOf(c||'');return o[(i+1)%o.length];},
    cellIcon:function(v){return v==='ok'?'✓':v==='bad'?'✗':v==='na'?'N/A':'';}
  }
};

/* ========== FUNCTIONS ========== */
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('collapsed'); document.getElementById('main-content').classList.toggle('expanded'); localStorage.setItem('sidebar_collapsed', document.getElementById('sidebar').classList.contains('collapsed')?'1':'0'); }
function switchTab(t){ App.state.currentTab=t; var tabs=document.querySelectorAll('.tab-content'); for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active'); var b=document.querySelectorAll('.sidebar-nav button'); for(var j=0;j<b.length;j++)b[j].classList.remove('active'); document.getElementById('tab-'+t).classList.add('active'); document.querySelector('[data-tab="'+t+'"]').classList.add('active'); if(t==='log')App.ui.renderLog(); if(t==='archive')App.ui.renderArchive(); if(t==='dashboard')App.ui.renderDashboard(); if(t==='settings')App.ui.renderSettings(); }
function showToast(m){ var c=document.getElementById('toast-container'); var t=document.createElement('div'); t.className='toast'; t.textContent=m; c.appendChild(t); setTimeout(function(){t.remove();},3000); }
function updateClock(){ document.getElementById('header-clock').textContent=new Date().toLocaleString('en-GB',{dateStyle:'full',timeStyle:'medium'}); }
setInterval(updateClock,1000);
function openModal(h){ document.getElementById('modal-content').innerHTML=h; document.getElementById('modal-overlay').classList.add('active'); }
function closeModal(){ document.getElementById('modal-overlay').classList.remove('active'); }
document.getElementById('modal-overlay').addEventListener('click',function(e){ if(e.target===this)closeModal(); });

/* ========== NORMALIZE RECORD ========== */
function normalizeRecord(r){
  if(!r) r = {};
  if(!r.cells) r.cells = {};
  if(!r.notes) r.notes = {};
  if(!r.techSignature) r.techSignature = '';
  if(!r.engSignature) r.engSignature = '';
  if(!r.generalNotes) r.generalNotes = '';
  return r;
}

/* ========== UI ========== */
App.ui={
  renderLog:function(){
    App.db.loadAll().then(function(allData){
      try{
        var items=App.state.inspectionItems;
        var days=App.utils.getDaysInMonth(App.state.currentYear,App.state.currentMonth);
        var key=App.utils.monthKey(App.state.currentUnit||'',App.state.currentYear,App.state.currentMonth);
        App.state.currentKey=key;
        var savedData = normalizeRecord(allData[key]);
        App.state.activeRecord = savedData;
        var h='<div class="card"><div class="card-title">📋 Monthly Maintenance Log</div><div class="form-grid">';
        h+='<div class="form-group"><label>Month</label><input type="month" value="'+App.state.currentYear+'-'+('0'+(App.state.currentMonth+1)).slice(-2)+'" onchange="onMonthChange(this.value)"></div>';
        h+='<div class="form-group"><label>AC Unit</label><select onchange="onUnitChange(this.value)"><option value="">-- Select --</option>';
        for(var u=0;u<App.state.units.length;u++)h+='<option value="'+App.state.units[u]+'"'+(App.state.units[u]===App.state.currentUnit?' selected':'')+'>'+App.state.units[u]+'</option>';
        h+='</select></div>';
        h+='<div class="form-group"><label>Technician</label><select onchange="onTechChange(this.value)"><option value="">-- Select --</option>';
        for(var t=0;t<App.state.technicians.length;t++)h+='<option value="'+App.state.technicians[t]+'"'+(savedData.techSignature===App.state.technicians[t]?' selected':'')+'>'+App.state.technicians[t]+'</option>';
        h+='</select></div>';
        h+='<div class="form-group"><label>Engineer</label><select onchange="onEngChange(this.value)"><option value="">-- Select --</option><option value="Eng. Ahmad Ali Bokar Nasib"'+(savedData.engSignature==='Eng. Ahmad Ali Bokar Nasib'?' selected':'')+'>Eng. Ahmad Ali Bokar Nasib</option></select></div></div>';
        h+='<div class="legend no-print"><span><span class="legend-box cell-ok"></span> ✓ OK</span><span><span class="legend-box cell-bad"></span> ✗ Bad</span><span><span class="legend-box cell-na"></span> N/A</span><span><span class="legend-box cell-empty"></span> Empty</span></div>';
        h+='<div style="overflow-x:auto;"><table class="log-table"><thead><tr><th style="min-width:160px;">INSPECTION ITEM</th>';
        for(var d=1;d<=days;d++)h+='<th>'+d+'</th>';
        h+='<th style="min-width:130px;">NOTES</th></tr></thead><tbody>';
        for(var idx=0;idx<items.length;idx++){
          h+='<tr><td class="item-col">'+items[idx]+'</td>';
          for(var dd=0;dd<days;dd++){
            var ck=idx+'|'+dd; var val=savedData.cells[ck]||'';
            var cls=val==='ok'?'cell-ok':val==='bad'?'cell-bad':val==='na'?'cell-na':'cell-empty';
            h+='<td class="'+cls+'" data-idx="'+idx+'" data-day="'+dd+'" onclick="cycleCell(this)">'+App.utils.cellIcon(val)+'</td>';
          }
          h+='<td class="notes-col"><input type="text" data-notes-idx="'+idx+'" value="'+(savedData.notes[idx]||'')+'" oninput="onNotesChange(this)"></td></tr>';
        }
        h+='</tbody></table></div>';
        h+='<div class="general-notes"><label>📝 General Notes</label><textarea id="general-notes" oninput="onGeneralNotesChange(this)">'+(savedData.generalNotes||'')+'</textarea></div>';
        h+='<div class="signatures no-print"><div class="signature-box">'+(savedData.techSignature||'Technician Signature')+'</div><div class="signature-box">'+(savedData.engSignature||'Engineer Signature')+'</div></div>';
        h+='<div class="no-print" style="display:flex;gap:10px;margin-top:15px;"><button class="btn btn-primary" onclick="printLog()">🖨️ Print</button><button class="btn btn-success" onclick="saveLog()">💾 Save</button><button class="btn btn-warning" onclick="resetGrid()">🔄 Reset</button></div></div>';
        document.getElementById('log-container').innerHTML=h;
      }catch(e){ document.getElementById('log-container').innerHTML='<div class="card"><p style="color:red;">Error: '+e.message+'</p></div>'; }
    });
  },
  renderArchive:function(){
    App.db.loadAll().then(function(allData){
      var keys=Object.keys(allData);
      if(keys.length===0){ document.getElementById('archive-container').innerHTML='<div class="card"><div class="card-title">📁 Archive</div><p style="text-align:center;padding:30px;">No saved logs.</p></div>'; return; }
      var h='<div class="card"><div class="card-title">📁 Archive</div><div class="no-print" style="margin-bottom:15px;display:flex;gap:10px;"><button class="btn btn-primary" onclick="App.db.exportJSON()">⬇️ Export</button><input type="file" id="af" accept=".json" style="display:none" onchange="importArchive(this)"><button class="btn btn-outline" onclick="document.getElementById(\'af\').click()">⬆️ Import</button></div><table class="archive-table"><thead><tr><th>Unit</th><th>Month</th><th>Tech</th><th>Eng</th><th>Actions</th></tr></thead><tbody>';
      for(var i=0;i<keys.length;i++){ var k=keys[i]; var r=normalizeRecord(allData[k]); var p=k.split('|');
        h+='<tr><td>'+p[0]+'</td><td>'+p[1]+'</td><td>'+(r.techSignature||'—')+'</td><td>'+(r.engSignature||'—')+'</td><td>';
        h+='<button class="btn btn-outline" onclick="viewArchive(\''+k+'\')">👁</button> <button class="btn btn-primary" onclick="printArchive(\''+k+'\')">🖨</button> <button class="btn btn-danger" onclick="deleteArchive(\''+k+'\')">🗑</button></td></tr>'; }
      h+='</tbody></table></div>';
      document.getElementById('archive-container').innerHTML=h;
    });
  },
  renderDashboard:function(){
    App.db.loadAll().then(function(allData){
      var keys=Object.keys(allData); var total=keys.length;
      var mk=App.utils.monthKey(App.state.currentUnit||'',App.state.currentYear,App.state.currentMonth);
      var cur=allData[mk]; var filled=0;
      if(cur){ for(var c in cur.cells){ if(cur.cells[c]) filled++; } }
      var pct=Math.round((filled/(App.state.inspectionItems.length*App.utils.getDaysInMonth(App.state.currentYear,App.state.currentMonth)))*100);
      var h='<div class="kpi-grid"><div class="kpi-card"><h2>'+total+'</h2><p>Total Logs</p></div><div class="kpi-card"><h2 style="color:var(--green-text)">'+filled+'</h2><p>Cells Filled</p></div><div class="kpi-card"><h2>'+App.state.units.length+'</h2><p>Units</p></div><div class="kpi-card"><h2>'+pct+'%</h2><p>Completion</p></div></div>';
      h+='<div class="card"><div class="card-title">🏢 Units Status</div><div class="units-grid">';
      for(var i=0;i<App.state.units.length;i++){ var uk=App.utils.monthKey(App.state.units[i],App.state.currentYear,App.state.currentMonth); var rec=allData[uk]; var bc='green'; var st='✅ OK';
        if(rec){ var bad=0; for(var cc in rec.cells){ if(rec.cells[cc]==='bad')bad++; } if(bad===0){bc='green';st='✅ OK';} else if(bad<=3){bc='amber';st='⚠️ '+bad;} else {bc='red';st='🔴 '+bad;} } else {bc='green';st='📝 Not inspected';}
        h+='<div class="unit-card '+bc+'"><div class="unit-name">'+App.state.units[i]+'</div><div class="unit-meta">'+st+'</div></div>'; }
      h+='</div></div>';
      document.getElementById('dashboard-container').innerHTML=h;
    });
  },
  renderSettings:function(){
    var h='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;">';
    h+='<div class="card"><div class="card-title">🏥 Hospital</div><input type="text" id="sh" value="'+App.state.settings.hospitalName+'" style="width:100%;padding:10px;margin-bottom:10px;"><button class="btn btn-primary" onclick="saveSettings()">💾 Save</button></div>';
    h+='<div class="card"><div class="card-title">👨‍🔧 Techs</div>';
    for(var i=0;i<App.state.technicians.length;i++) h+='<div style="display:flex;gap:5px;margin-bottom:5px;"><input type="text" value="'+App.state.technicians[i]+'" onchange="updateTech('+i+',this.value)" style="flex:1;padding:8px;"><button class="btn btn-danger" onclick="deleteTech('+i+')">🗑</button></div>';
    h+='<button class="btn btn-outline" onclick="addTech()">➕ Add</button></div>';
    h+='<div class="card"><div class="card-title">❄️ Units</div>';
    for(var j=0;j<App.state.units.length;j++) h+='<div style="display:flex;gap:5px;margin-bottom:5px;"><input type="text" value="'+App.state.units[j]+'" onchange="updateUnit('+j+',this.value)" style="flex:1;padding:8px;"><button class="btn btn-danger" onclick="deleteUnit('+j+')">🗑</button></div>';
    h+='<button class="btn btn-outline" onclick="addUnit()">➕ Add</button></div>';
    h+='<div class="card"><div class="card-title">🔧 Items</div>';
    for(var k=0;k<App.state.inspectionItems.length;k++) h+='<div style="display:flex;gap:5px;margin-bottom:5px;"><input type="text" value="'+App.state.inspectionItems[k]+'" onchange="updateItem('+k+',this.value)" style="flex:1;padding:8px;"><button class="btn btn-danger" onclick="deleteItem('+k+')">🗑</button></div>';
    h+='<button class="btn btn-outline" onclick="addItem()">➕ Add</button></div>';
    h+='<div class="card"><div class="card-title">💾 Data</div><button class="btn btn-primary" onclick="App.db.exportJSON()">⬇️ Export</button> <button class="btn btn-danger" onclick="confirmClearAll()">🗑 Clear All</button></div></div>';
    document.getElementById('settings-container').innerHTML=h;
  }
};

/* ========== INTERACTIONS ========== */
function onMonthChange(v){ var p=v.split('-'); App.state.currentYear=parseInt(p[0]); App.state.currentMonth=parseInt(p[1])-1; App.ui.renderLog(); }
function onUnitChange(v){ App.state.currentUnit=v; App.ui.renderLog(); }
function onTechChange(v){ if(App.state.activeRecord){ App.state.activeRecord.techSignature=v; autoSave(); } }
function onEngChange(v){ if(App.state.activeRecord){ App.state.activeRecord.engSignature=v; autoSave(); } }
function cycleCell(td){ if(!App.state.activeRecord) return; if(!App.state.activeRecord.cells) App.state.activeRecord.cells={}; var idx=parseInt(td.dataset.idx); var day=parseInt(td.dataset.day); var ck=idx+'|'+day; var cur=App.state.activeRecord.cells[ck]||''; var next=App.utils.cycleCell(cur); App.state.activeRecord.cells[ck]=next; td.className=next==='ok'?'cell-ok':next==='bad'?'cell-bad':next==='na'?'cell-na':'cell-empty'; td.textContent=App.utils.cellIcon(next); autoSave(); }
function onNotesChange(input){ if(!App.state.activeRecord) return; if(!App.state.activeRecord.notes) App.state.activeRecord.notes={}; App.state.activeRecord.notes[parseInt(input.dataset.notesIdx)]=input.value; autoSave(); }
function onGeneralNotesChange(textarea){ if(App.state.activeRecord){ App.state.activeRecord.generalNotes=textarea.value; autoSave(); } }
function autoSave(){ if(!App.state.currentKey || !App.state.activeRecord) return; var allData=JSON.parse(localStorage.getItem('hvac_monthly_logs')||'{}'); allData[App.state.currentKey]=App.state.activeRecord; App.db.saveAll(allData); }
function saveLog(){ autoSave(); showToast('✅ Saved'); }
function resetGrid(){ if(confirm('Clear?')){ if(App.state.activeRecord){ App.state.activeRecord.cells={}; App.state.activeRecord.notes={}; App.state.activeRecord.generalNotes=''; } App.ui.renderLog(); } }

/* ========== PRINT ========== */
function printLog(){
  if(!App.state.activeRecord) { showToast('⚠️ No data to print'); return; }
  var items=App.state.inspectionItems; var days=App.utils.getDaysInMonth(App.state.currentYear,App.state.currentMonth);
  var h='<html><head><title>Log</title><style>body{font-family:Georgia;padding:15px}.ph{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:15px}.ph img{width:60px;height:60px;border-radius:50%}table{width:100%;border-collapse:collapse;font-size:9px}th{background:#eee;border:1px solid #000;padding:5px}td{border:1px solid #000;text-align:center;height:20px}.item-col{text-align:right;font-size:8px;font-weight:600;background:#f0f0f0}.cell-ok{background:#d9f2e1}.cell-bad{background:#fbe0e2}.cell-na{background:#fff1cc}.sig{display:flex;justify-content:space-between;margin-top:25px;font-size:11px}.sl{width:200px;border-top:1px solid #000;text-align:center;padding-top:5px}@page{size:A4 landscape;margin:8mm}</style></head><body>';
  h+='<div class="ph"><img src="'+App.state.settings.logo+'"><div style="text-align:center"><h2>'+App.state.settings.hospitalName+'</h2><h3>MONTHLY HVAC MAINTENANCE LOG</h3></div><div>Unit: '+(App.state.currentUnit||'N/A')+'</div></div>';
  h+='<table><thead><tr><th>ITEM</th>';
  for(var d=1;d<=days;d++)h+='<th>'+d+'</th>';
  h+='<th>NOTES</th></tr></thead><tbody>';
  for(var idx=0;idx<items.length;idx++){ h+='<tr><td class="item-col">'+items[idx]+'</td>';
    for(var dd=0;dd<days;dd++){ var v=App.state.activeRecord.cells[idx+'|'+dd]||''; h+='<td class="cell-'+(v==='ok'?'ok':v==='bad'?'bad':v==='na'?'na':'')+'">'+App.utils.cellIcon(v)+'</td>'; }
    h+='<td>'+(App.state.activeRecord.notes[idx]||'')+'</td></tr>'; }
  h+='</tbody></table>';
  h+='<p><strong>General Notes:</strong> '+(App.state.activeRecord.generalNotes||'—')+'</p>';
  h+='<div class="sig"><div class="sl">'+(App.state.activeRecord.techSignature||'Technician')+'</div><div class="sl">'+(App.state.activeRecord.engSignature||'Engineer')+'</div></div></body></html>';
  var w=window.open('','_blank'); w.document.write(h); w.document.close(); setTimeout(function(){w.print();},500);
}

/* ========== ARCHIVE ========== */
function importArchive(input){ if(input.files[0]) App.db.importJSON(input.files[0]); }
function viewArchive(key){ App.db.loadAll().then(function(allData){ var r=normalizeRecord(allData[key]); if(!r)return; var items=App.state.inspectionItems; var p=key.split('|'); var m=p[1].split('-'); var y=parseInt(m[0]), mm=parseInt(m[1])-1; var days=App.utils.getDaysInMonth(y,mm);
  var h='<h3>📋 Log</h3><p>Unit: '+p[0]+' | Month: '+p[1]+'</p><p>Tech: '+(r.techSignature||'—')+' | Eng: '+(r.engSignature||'—')+'</p><div style="overflow-x:auto;"><table class="log-table"><thead><tr><th>Item</th>';
  for(var d=1;d<=days;d++)h+='<th>'+d+'</th>'; h+='</tr></thead><tbody>';
  for(var idx=0;idx<items.length;idx++){ h+='<tr><td class="item-col">'+items[idx]+'</td>';
    for(var dd=0;dd<days;dd++){ var v=r.cells[idx+'|'+dd]||''; h+='<td class="cell-'+(v==='ok'?'ok':v==='bad'?'bad':v==='na'?'na':'empty')+'">'+App.utils.cellIcon(v)+'</td>'; }
    h+='</tr>'; }
  h+='</tbody></table></div>';
  if(r.generalNotes)h+='<p><strong>General Notes:</strong> '+r.generalNotes+'</p>';
  h+='<button class="btn btn-primary" onclick="closeModal()">Close</button>';
  openModal(h); });
}
function deleteArchive(key){ if(confirm('Delete?')){ var allData=JSON.parse(localStorage.getItem('hvac_monthly_logs')||'{}'); delete allData[key]; App.db.saveAll(allData); App.ui.renderArchive(); showToast('🗑 Deleted'); } }
function printArchive(key){ App.db.loadAll().then(function(allData){ var r=normalizeRecord(allData[key]); if(!r)return; var p=key.split('|'); App.state.currentUnit=p[0]; var m=p[1].split('-'); App.state.currentYear=parseInt(m[0]); App.state.currentMonth=parseInt(m[1])-1; App.state.activeRecord=r; App.state.currentKey=key; App.ui.renderLog(); setTimeout(function(){printLog();},500); }); }

/* ========== SETTINGS ========== */
function saveSettings(){ App.state.settings.hospitalName=document.getElementById('sh').value; App.db.saveSettings(App.state.settings); showToast('✅ Saved'); }
function updateTech(i,v){ App.state.technicians[i]=v; localStorage.setItem('hvac_monthly_techs',JSON.stringify(App.state.technicians)); }
function deleteTech(i){ App.state.technicians.splice(i,1); localStorage.setItem('hvac_monthly_techs',JSON.stringify(App.state.technicians)); App.ui.renderSettings(); }
function addTech(){ App.state.technicians.push('New Tech'); localStorage.setItem('hvac_monthly_techs',JSON.stringify(App.state.technicians)); App.ui.renderSettings(); }
function updateUnit(i,v){ App.state.units[i]=v; localStorage.setItem('hvac_monthly_units',JSON.stringify(App.state.units)); }
function deleteUnit(i){ App.state.units.splice(i,1); localStorage.setItem('hvac_monthly_units',JSON.stringify(App.state.units)); App.ui.renderSettings(); }
function addUnit(){ App.state.units.push('New Unit'); localStorage.setItem('hvac_monthly_units',JSON.stringify(App.state.units)); App.ui.renderSettings(); }
function updateItem(i,v){ App.state.inspectionItems[i]=v; localStorage.setItem('hvac_monthly_items',JSON.stringify(App.state.inspectionItems)); }
function deleteItem(i){ App.state.inspectionItems.splice(i,1); localStorage.setItem('hvac_monthly_items',JSON.stringify(App.state.inspectionItems)); App.ui.renderSettings(); }
function addItem(){ App.state.inspectionItems.push('New Item'); localStorage.setItem('hvac_monthly_items',JSON.stringify(App.state.inspectionItems)); App.ui.renderSettings(); }
function confirmClearAll(){ if(confirm('⚠️ Delete ALL?')){ localStorage.removeItem('hvac_monthly_logs'); localStorage.removeItem('hvac_monthly_draft'); if(firebaseConnected)firebaseDB.ref('logs').remove(); showToast('🗑 Cleared'); App.ui.renderArchive(); } }

/* ========== INIT ========== */
function initApp(){
  var s=App.db.loadSettings(); if(Object.keys(s).length)App.state.settings=Object.assign({},App.state.settings,s);
  var t=JSON.parse(localStorage.getItem('hvac_monthly_techs')||'null'); if(t)App.state.technicians=t;
  var u=JSON.parse(localStorage.getItem('hvac_monthly_units')||'null'); if(u)App.state.units=u;
  var it=JSON.parse(localStorage.getItem('hvac_monthly_items')||'null'); if(it)App.state.inspectionItems=it;
  if(localStorage.getItem('sidebar_collapsed')==='1'){document.getElementById('sidebar').classList.add('collapsed');document.getElementById('main-content').classList.add('expanded');}
  updateClock(); App.ui.renderLog();
}
initApp();
</script>
</body>
