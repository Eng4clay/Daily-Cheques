<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly HVAC Maintenance Log</title>
<style>
:root{--navy:#0F2A47;--steel:#2C5F8A;--light-blue:#DCE8F2;--gold:#B8860B;--green-bg:#D9F2E1;--green-text:#1E7145;--amber-bg:#FFF1CC;--amber-text:#B8860B;--red-bg:#FBE0E2;--red-text:#B23A48;--gray:#F4F6F8;--white:#FFFFFF;--shadow:0 2px 8px rgba(0,0,0,0.08);--radius:6px;--transition:all .2s ease}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--gray);color:var(--navy);min-height:100vh;display:flex}
.sidebar{width:240px;background:var(--navy);color:var(--white);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{padding:20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#fff;padding:3px}
.sidebar-logo h3{font-size:14px;margin-top:8px;color:var(--light-blue)}
.sidebar-nav{flex:1;padding:15px 0}
.sidebar-nav button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;background:transparent;border:none;color:var(--light-blue);font-size:15px;cursor:pointer;transition:var(--transition);text-align:left}
.sidebar-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar-nav button.active{background:var(--steel);color:#fff;border-left:4px solid var(--gold)}
.sidebar-footer{padding:15px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:var(--light-blue);text-align:center}
.main-content{flex:1;margin-left:240px;padding:20px;min-height:100vh}
.app-header{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.app-header h1{font-size:22px;color:var(--navy)}
.app-header p{font-size:13px;color:var(--steel)}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card-title{font-size:16px;font-weight:700;color:var(--steel);margin-bottom:15px;border-bottom:2px solid var(--light-blue);padding-bottom:10px}
.btn{padding:10px 20px;border-radius:var(--radius);border:none;font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn-primary{background:var(--steel);color:#fff}
.btn-success{background:var(--green-text);color:#fff}
.btn-warning{background:var(--amber-text);color:#fff}
.btn-danger{background:var(--red-text);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--steel);color:var(--steel)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.form-group label{display:block;font-weight:600;margin-bottom:5px;font-size:13px;color:var(--steel)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:var(--radius);font-size:14px;font-family:inherit}
.log-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.log-table th{background:var(--navy);color:#fff;padding:8px 4px;text-align:center;font-size:11px;font-weight:600;border:1px solid #333}
.log-table td{border:1px solid #ccc;padding:0;text-align:center;height:36px;cursor:pointer;transition:background .15s ease;font-size:14px}
.log-table td:hover{background:var(--light-blue)!important}
.log-table .item-col{text-align:right;padding:0 10px;font-size:12px;font-weight:600;background:var(--light-blue);cursor:default;white-space:nowrap}
.log-table .notes-col{min-width:120px;padding:0}
.log-table .notes-col input{width:100%;height:100%;border:none;padding:5px;font-size:11px;background:transparent;text-align:center}
.log-table .notes-col input:focus{outline:2px solid var(--steel);background:#fff}
.cell-empty{background:#fff}
.cell-ok{background:var(--green-bg);color:var(--green-text);font-weight:700}
.cell-bad{background:var(--red-bg);color:var(--red-text);font-weight:700}
.cell-na{background:var(--amber-bg);color:var(--amber-text);font-weight:700}
.signatures{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:20px}
.signature-box{border-top:1px solid #000;padding-top:8px;text-align:center;font-size:13px;font-weight:600}
.archive-table{width:100%;border-collapse:collapse;font-size:13px}
.archive-table th{background:var(--navy);color:#fff;padding:10px;text-align:left;font-size:12px}
.archive-table td{padding:10px;border-bottom:1px solid #e0e0e0}
.archive-table tr:nth-child(even){background:var(--gray)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:none;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:25px;max-width:800px;width:90%;max-height:80vh;overflow-y:auto}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999}
.toast{background:var(--navy);color:#fff;padding:14px 20px;border-radius:var(--radius);margin-top:10px;animation:slideIn .3s ease;font-size:14px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:15px;font-size:12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend-box{width:18px;height:18px;border:1px solid #ccc;border-radius:3px;display:inline-block}
@media print{.sidebar,.app-header,.btn,.toast-container,#header-clock,.no-print{display:none!important}.main-content{margin:0;padding:0}body{background:#fff}.card{box-shadow:none;border:none;padding:0}@page{size:A4 landscape;margin:10mm}.log-table th{font-size:9px;padding:5px 2px}.log-table td{height:25px;font-size:11px}.log-table .item-col{font-size:10px;padding:0 5px}}
@media(max-width:768px){.sidebar{width:100%;height:auto;position:fixed;bottom:0;top:auto;flex-direction:row;z-index:100}.sidebar-logo{display:none}.sidebar-nav{display:flex;padding:0}.sidebar-nav button{flex:1;justify-content:center;padding:10px 5px;font-size:11px;flex-direction:column;gap:2px}.sidebar-footer{display:none}.main-content{margin-left:0;margin-bottom:60px;padding:10px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">
    <img id="sidebar-logo-img" src="https://alhqyq.com/contents/newsm/18346_0.jpg" alt="Logo">
    <h3>Abu Arish General Hospital</h3>
  </div>
  <nav class="sidebar-nav">
    <button class="active" data-tab="log" onclick="switchTab('log')">📋 Monthly Log</button>
    <button data-tab="archive" onclick="switchTab('archive')">📁 Archive</button>
    <button data-tab="settings" onclick="switchTab('settings')">⚙ Settings</button>
  </nav>
  <div class="sidebar-footer">HVAC Engineering & Maintenance<br>Version 2.0 — 2026</div>
</aside>
<main class="main-content">
  <header class="app-header">
    <div><h1>Monthly HVAC Maintenance Log</h1><p>Engineering & Maintenance Department — Abu Arish General Hospital</p></div>
    <div id="header-clock" style="font-size:14px;color:var(--steel);font-weight:600;"></div>
  </header>
  <div id="tab-log" class="tab-content active"><div id="log-container">Loading...</div></div>
  <div id="tab-archive" class="tab-content"><div id="archive-container">Loading...</div></div>
  <div id="tab-settings" class="tab-content"><div id="settings-container">Loading...</div></div>
</main>
<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
<script>
/* ========== CORE APP ========== */
var App = {
  state: {
    currentTab: 'log',
    settings: { hospitalName: 'Abu Arish General Hospital', department: 'Engineering & Maintenance — HVAC Section', logo: 'https://alhqyq.com/contents/newsm/18346_0.jpg', version: '2.0', lastBackup: null },
    technicians: ['Najam-ud-Din Zakirullah','Arshad Hussain Dilshad','Mohammad Zafar Saleek','Imam Bahai','Danish','Jaffar','Mumtaz Afi Sheikh'],
    units: ['I.C.U ROOM-PY100','I.C.U-CY240','I.C.U NEW-CTX025','O.R-1-CTX050','O.R-2-CTX050','O.R CENTRAL-LDX040','O.R-1 CORRIDOR-CTX030','MEDICAL GAS-CY100','X-RAY-CY240','X-RAY-CY240 (2)','LAB-CTX040','PHARMACY-PTX100','PHARMACY 1ST FL-PTX016','OLD E.R-PRX050','F.M.E.R-PTX030','M.E.R-PTX030','O.P.D NEW-CTX016','D.R NEW-CTX030','CSSD-CTX030','PEDIA-PTX050','CORRIDOR-PS300','F.W-PRX050','M.W-PRX050','DIRECTOR (NEW)-CTX070','LAUNDRY-CY300','MEDICAL STORE (1)-PY340','MEDICAL STORE (2)-PY340','MEDICAL STORE (3)-CTX030','MEDICAL STORE (4)-PY340'],
    inspectionItems: ['Condenser Coils','Freon Leakage','Thermostat','Compressor (1)','Compressor (2)','Contactor','Condenser Fan Motor','Blower Motor','Blower Belt','Filter Dryer','Pressure Switch LP/HP','Vibration Isolator','Electrical Wiring','Duct Insulation','Unit Cleanliness','Drainage System'],
    currentMonth: new Date().getMonth(),
    currentYear: new Date().getFullYear(),
    currentUnit: '',
    currentGrid: {},
    activeRecord: null,
    currentKey: ''
  },
  db: {
    loadAll: function(){ try { return JSON.parse(localStorage.getItem('hvac_monthly_logs') || '{}'); } catch(e) { return {}; } },
    saveAll: function(data){ try { localStorage.setItem('hvac_monthly_logs', JSON.stringify(data)); return true; } catch(e) { showToast('⚠️ Save failed'); return false; } },
    loadSettings: function(){ try { return JSON.parse(localStorage.getItem('hvac_monthly_settings') || '{}'); } catch(e) { return {}; } },
    saveSettings: function(s){ try { localStorage.setItem('hvac_monthly_settings', JSON.stringify(s)); } catch(e){} },
    loadDraft: function(){ try { return JSON.parse(localStorage.getItem('hvac_monthly_draft') || 'null'); } catch(e) { return null; } },
    saveDraft: function(d){ try { localStorage.setItem('hvac_monthly_draft', JSON.stringify(d)); } catch(e){} },
    clearDraft: function(){ localStorage.removeItem('hvac_monthly_draft'); },
    exportJSON: function(){
      var data = { exportedAt: new Date().toISOString(), logs: this.loadAll(), settings: App.state.settings };
      var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url;
      a.download = 'MonthlyLog_Backup_' + new Date().toISOString().split('T')[0] + '.json'; a.click(); URL.revokeObjectURL(url);
      showToast('✅ Backup exported');
    },
    importJSON: function(file){
      var reader = new FileReader();
      reader.onload = function(e){
        try { var data = JSON.parse(e.target.result); if(data.logs){ localStorage.setItem('hvac_monthly_logs', JSON.stringify(data.logs)); if(data.settings){ App.state.settings = Object.assign({}, App.state.settings, data.settings); App.db.saveSettings(App.state.settings); } App.ui.renderArchive(); showToast('✅ Backup imported'); } } catch(err) { showToast('❌ Invalid file'); }
      };
      reader.readAsText(file);
    }
  },
  utils: {
    uuid: function(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){ var r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16); }); },
    getDaysInMonth: function(y, m){ return new Date(y, m+1, 0).getDate(); },
    monthKey: function(unit, y, m){ return unit + '|' + y + '-' + ('0' + (m+1)).slice(-2); },
    cycleCell: function(current){
      var order = ['', 'ok', 'bad', 'na']; var idx = order.indexOf(current || ''); return order[(idx + 1) % order.length];
    },
    cellIcon: function(val){ return val === 'ok' ? '✓' : val === 'bad' ? '✗' : val === 'na' ? 'N/A' : ''; }
  }
};

/* ========== TAB SWITCH ========== */
function switchTab(tab){
  App.state.currentTab = tab;
  var tabs = document.querySelectorAll('.tab-content');
  for(var i=0; i<tabs.length; i++) tabs[i].classList.remove('active');
  var btns = document.querySelectorAll('.sidebar-nav button');
  for(var j=0; j<btns.length; j++) btns[j].classList.remove('active');
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
  if(tab === 'log') App.ui.renderLog();
  if(tab === 'archive') App.ui.renderArchive();
  if(tab === 'settings') App.ui.renderSettings();
}

/* ========== TOAST ========== */
function showToast(msg){
  var c = document.getElementById('toast-container'); var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; c.appendChild(t); setTimeout(function(){ t.remove(); }, 3000);
}

/* ========== CLOCK ========== */
function updateClock(){
  document.getElementById('header-clock').textContent = new Date().toLocaleString('en-GB', {dateStyle:'full', timeStyle:'medium'});
}
setInterval(updateClock, 1000);

/* ========== MODAL ========== */
function openModal(html){
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('active');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('active'); }
document.getElementById('modal-overlay').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

/* ========== RENDER LOG ========== */
App.ui = {
  renderLog: function(){
    try{
      var container = document.getElementById('log-container');
      var items = App.state.inspectionItems;
      var days = App.utils.getDaysInMonth(App.state.currentYear, App.state.currentMonth);
      var monthLabel = new Date(App.state.currentYear, App.state.currentMonth).toLocaleString('en-US', {month:'long', year:'numeric'});
      var key = App.utils.monthKey(App.state.currentUnit || '', App.state.currentYear, App.state.currentMonth);
      App.state.currentKey = key;
      var allData = App.db.loadAll();
      var savedData = allData[key] || {cells:{}, notes:{}, techSignature:'', engSignature:''};
      App.state.activeRecord = savedData;

      var units = App.state.units;
      var techs = App.state.technicians;

      var html = '';
      html += '<div class="card"><div class="card-title">📋 Monthly Maintenance Log</div>';
      html += '<div class="form-grid">';
      html += '<div class="form-group"><label>Month</label><input type="month" id="log-month" value="' + App.state.currentYear + '-' + ('0' + (App.state.currentMonth+1)).slice(-2) + '" onchange="onMonthChange(this.value)"></div>';
      html += '<div class="form-group"><label>AC Unit</label><select id="log-unit" onchange="onUnitChange(this.value)"><option value="">-- Select Unit --</option>';
      for(var u=0; u<units.length; u++){ html += '<option value="' + units[u] + '"' + (units[u] === App.state.currentUnit ? ' selected' : '') + '>' + units[u] + '</option>'; }
      html += '</select></div>';
      html += '<div class="form-group"><label>Technician</label><select id="log-tech" onchange="onTechChange(this.value)"><option value="">-- Select --</option>';
      for(var t=0; t<techs.length; t++){ html += '<option value="' + techs[t] + '"' + (savedData.techSignature === techs[t] ? ' selected' : '') + '>' + techs[t] + '</option>'; }
      html += '</select></div>';
      html += '<div class="form-group"><label>Engineer</label><select id="log-eng" onchange="onEngChange(this.value)"><option value="">-- Select --</option>';
      html += '<option value="Eng. Ahmad Ali Bokar Nasib"' + (savedData.engSignature === 'Eng. Ahmad Ali Bokar Nasib' ? ' selected' : '') + '>Eng. Ahmad Ali Bokar Nasib</option>';
      html += '</select></div></div>';

      html += '<div class="legend no-print"><span><span class="legend-box cell-ok"></span> ✓ OK</span><span><span class="legend-box cell-bad"></span> ✗ Bad</span><span><span class="legend-box cell-na"></span> N/A</span><span><span class="legend-box cell-empty"></span> Empty</span></div>';
      html += '<p style="font-size:13px;color:var(--steel);margin-bottom:10px;">📅 ' + monthLabel + ' — ' + days + ' days</p>';
      html += '<div style="overflow-x:auto;"><table class="log-table" id="log-table"><thead><tr><th style="min-width:160px;">INSPECTION ITEM</th>';
      for(var d=1; d<=days; d++){ html += '<th>' + d + '</th>'; }
      html += '<th style="min-width:130px;">NOTES</th></tr></thead><tbody>';
      for(var idx=0; idx<items.length; idx++){
        html += '<tr><td class="item-col">' + items[idx] + '</td>';
        for(var dd=0; dd<days; dd++){
          var cellKey = idx + '|' + dd;
          var val = savedData.cells[cellKey] || '';
          var cls = val === 'ok' ? 'cell-ok' : val === 'bad' ? 'cell-bad' : val === 'na' ? 'cell-na' : 'cell-empty';
          html += '<td class="' + cls + '" data-idx="' + idx + '" data-day="' + dd + '" onclick="cycleCell(this)">' + App.utils.cellIcon(val) + '</td>';
        }
        html += '<td class="notes-col"><input type="text" data-notes-idx="' + idx + '" value="' + (savedData.notes[idx] || '') + '" placeholder="..." oninput="onNotesChange(this)"></td></tr>';
      }
      html += '</tbody></table></div>';
      html += '<div class="signatures no-print"><div class="signature-box" id="tech-signature-display">' + (savedData.techSignature || 'Technician Signature') + '</div><div class="signature-box" id="eng-signature-display">' + (savedData.engSignature || 'Engineer Signature') + '</div></div>';
      html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px;" class="no-print"><button class="btn btn-primary" onclick="printLog()">🖨️ Print</button><button class="btn btn-success" onclick="saveLog()">💾 Save Log</button><button class="btn btn-warning" onclick="resetGrid()">🔄 Reset Grid</button></div>';
      html += '</div>';
      container.innerHTML = html;
    } catch(err) {
      document.getElementById('log-container').innerHTML = '<div class="card"><p style="color:red;">Error: ' + err.message + '</p></div>';
    }
  },
  renderArchive: function(){
    try{
      var container = document.getElementById('archive-container');
      var allData = App.db.loadAll();
      var keys = Object.keys(allData);
      if(keys.length === 0){ container.innerHTML = '<div class="card"><div class="card-title">📁 Archive</div><p style="text-align:center;color:var(--steel);padding:30px;">No saved logs.</p></div>'; return; }
      var html = '<div class="card"><div class="card-title">📁 Archive — Saved Monthly Logs</div><div class="no-print" style="margin-bottom:15px;display:flex;gap:10px;"><button class="btn btn-primary" onclick="App.db.exportJSON()">⬇️ Export Backup</button><input type="file" id="archive-import" accept=".json" style="display:none;" onchange="importArchive(this)"><button class="btn btn-outline" onclick="document.getElementById(\'archive-import\').click()">⬆️ Import Backup</button></div><table class="archive-table"><thead><tr><th>Unit</th><th>Month</th><th>Technician</th><th>Engineer</th><th>Actions</th></tr></thead><tbody>';
      for(var i=0; i<keys.length; i++){
        var k = keys[i]; var r = allData[k]; var parts = k.split('|');
        html += '<tr><td>' + parts[0] + '</td><td>' + parts[1] + '</td><td>' + (r.techSignature || '—') + '</td><td>' + (r.engSignature || '—') + '</td><td>';
        html += '<button class="btn btn-outline" onclick="viewArchive(\'' + k + '\')" style="padding:5px 10px;font-size:12px;">👁</button> ';
        html += '<button class="btn btn-primary" onclick="printArchive(\'' + k + '\')" style="padding:5px 10px;font-size:12px;">🖨</button> ';
        html += '<button class="btn btn-danger" onclick="deleteArchive(\'' + k + '\')" style="padding:5px 10px;font-size:12px;">🗑</button></td></tr>';
      }
      html += '</tbody></table></div>';
      container.innerHTML = html;
    } catch(err) { document.getElementById('archive-container').innerHTML = '<p style="color:red;">Error: ' + err.message + '</p>'; }
  },
  renderSettings: function(){
    try{
      var container = document.getElementById('settings-container');
      var s = App.state.settings;
      var html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;">';
      html += '<div class="card"><div class="card-title">🏥 Hospital Info</div><label style="display:block;font-weight:600;margin-bottom:5px;">Hospital Name</label><input type="text" id="set-hospital" value="' + s.hospitalName + '" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;"><label style="display:block;font-weight:600;margin-bottom:5px;">Department</label><input type="text" id="set-department" value="' + s.department + '" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;"><button class="btn btn-primary" onclick="saveSettings()">💾 Save</button></div>';
      html += '<div class="card"><div class="card-title">👨‍🔧 Technicians</div><div id="tech-list">';
      for(var i=0; i<App.state.technicians.length; i++){ html += '<div style="display:flex;gap:5px;margin-bottom:5px;"><input type="text" value="' + App.state.technicians[i] + '" onchange="updateTech(' + i + ',this.value)" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:6px;"><button class="btn btn-danger" onclick="deleteTech(' + i + ')" style="padding:8px 12px;">🗑</button></div>'; }
      html += '<button class="btn btn-outline" onclick="addTech()" style="margin-top:10px;">➕ Add Technician</button></div></div>';
      html += '<div class="card"><div class="card-title">❄️ AC Units</div><div id="unit-list">';
      for(var j=0; j<App.state.units.length; j++){ html += '<div style="display:flex;gap:5px;margin-bottom:5px;"><input type="text" value="' + App.state.units[j] + '" onchange="updateUnit(' + j + ',this.value)" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:6px;"><button class="btn btn-danger" onclick="deleteUnit(' + j + ')" style="padding:8px 12px;">🗑</button></div>'; }
      html += '<button class="btn btn-outline" onclick="addUnit()" style="margin-top:10px;">➕ Add Unit</button></div></div>';
      html += '<div class="card"><div class="card-title">🔧 Inspection Items</div><div id="item-list">';
      for(var k=0; k<App.state.inspectionItems.length; k++){ html += '<div style="display:flex;gap:5px;margin-bottom:5px;"><input type="text" value="' + App.state.inspectionItems[k] + '" onchange="updateItem(' + k + ',this.value)" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:6px;"><button class="btn btn-danger" onclick="deleteItem(' + k + ')" style="padding:8px 12px;">🗑</button></div>'; }
      html += '<button class="btn btn-outline" onclick="addItem()" style="margin-top:10px;">➕ Add Item</button></div></div>';
      html += '<div class="card"><div class="card-title">💾 Data Management</div><div style="display:flex;flex-direction:column;gap:10px;"><button class="btn btn-primary" onclick="App.db.exportJSON()">⬇️ Export Backup (JSON)</button><button class="btn btn-danger" onclick="confirmClearAll()">🗑 Clear All Data</button></div></div>';
      html += '</div>';
      container.innerHTML = html;
    } catch(err) { document.getElementById('settings-container').innerHTML = '<p style="color:red;">Error: ' + err.message + '</p>'; }
  }
};

/* ========== INTERACTION FUNCTIONS ========== */
function onMonthChange(val){ var parts = val.split('-'); App.state.currentYear = parseInt(parts[0],10); App.state.currentMonth = parseInt(parts[1],10)-1; saveDraft(); App.ui.renderLog(); }
function onUnitChange(val){ App.state.currentUnit = val; saveDraft(); App.ui.renderLog(); }
function onTechChange(val){ if(App.state.activeRecord){ App.state.activeRecord.techSignature = val; autoSaveGrid(); var el = document.getElementById('tech-signature-display'); if(el) el.textContent = val || 'Technician Signature'; } }
function onEngChange(val){ if(App.state.activeRecord){ App.state.activeRecord.engSignature = val; autoSaveGrid(); var el = document.getElementById('eng-signature-display'); if(el) el.textContent = val || 'Engineer Signature'; } }
function cycleCell(td){ var idx = parseInt(td.dataset.idx,10); var day = parseInt(td.dataset.day,10); var cellKey = idx + '|' + day; var current = App.state.activeRecord.cells[cellKey] || ''; var next = App.utils.cycleCell(current); App.state.activeRecord.cells[cellKey] = next; td.className = next === 'ok' ? 'cell-ok' : next === 'bad' ? 'cell-bad' : next === 'na' ? 'cell-na' : 'cell-empty'; td.textContent = App.utils.cellIcon(next); autoSaveGrid(); }
function onNotesChange(input){ var idx = parseInt(input.dataset.notesIdx,10); App.state.activeRecord.notes[idx] = input.value; autoSaveGrid(); }
function autoSaveGrid(){ if(!App.state.currentKey || !App.state.activeRecord) return; var allData = App.db.loadAll(); allData[App.state.currentKey] = App.state.activeRecord; App.db.saveAll(allData); }
function saveLog(){ autoSaveGrid(); showToast('✅ Log saved'); }
function resetGrid(){ if(confirm('Clear entire grid?')){ App.state.activeRecord.cells = {}; App.state.activeRecord.notes = {}; App.ui.renderLog(); showToast('🔄 Grid reset'); } }
function saveDraft(){ App.db.saveDraft({ currentUnit: App.state.currentUnit, currentMonth: App.state.currentMonth, currentYear: App.state.currentYear }); }

/* ========== PRINT ========== */
function printLog(){
  var items = App.state.inspectionItems;
  var days = App.utils.getDaysInMonth(App.state.currentYear, App.state.currentMonth);
  var logo = App.state.settings.logo;
  var html = '<html><head><title>Monthly Log</title><style>body{font-family:Georgia,serif;color:#000;margin:0;padding:15px}.print-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:15px}.print-header img{width:60px;height:60px;border-radius:50%}table{width:100%;border-collapse:collapse;font-size:9px}th{background:#eee;border:1px solid #000;padding:5px 2px}td{border:1px solid #000;text-align:center;height:20px}.item-col{text-align:right;padding:0 5px;font-size:8px;font-weight:600;background:#f0f0f0}.cell-ok{background:#d9f2e1;color:#1e7145;font-weight:700}.cell-bad{background:#fbe0e2;color:#b23a48;font-weight:700}.cell-na{background:#fff1cc;color:#b8860b;font-weight:700}.signatures{display:flex;justify-content:space-between;margin-top:25px;font-size:11px}.sig-line{width:200px;border-top:1px solid #000;text-align:center;padding-top:5px}@page{size:A4 landscape;margin:8mm}</style></head><body>';
  html += '<div class="print-header"><img src="' + logo + '"><div style="text-align:center"><h2 style="margin:0">' + App.state.settings.hospitalName + '</h2><p style="margin:3px 0">' + App.state.settings.department + '</p><h3 style="margin:0">MONTHLY HVAC MAINTENANCE LOG</h3></div><div style="font-size:9px">Unit: ' + (App.state.currentUnit || 'N/A') + '<br>' + new Date(App.state.currentYear, App.state.currentMonth).toLocaleString('en-US',{month:'long',year:'numeric'}) + '</div></div>';
  html += '<table><thead><tr><th style="min-width:160px">INSPECTION ITEM</th>';
  for(var d=1; d<=days; d++){ html += '<th>' + d + '</th>'; }
  html += '<th style="min-width:120px">NOTES</th></tr></thead><tbody>';
  for(var idx=0; idx<items.length; idx++){
    html += '<tr><td class="item-col">' + items[idx] + '</td>';
    for(var dd=0; dd<days; dd++){
      var cellKey = idx + '|' + dd;
      var val = App.state.activeRecord.cells[cellKey] || '';
      var cls = val === 'ok' ? 'cell-ok' : val === 'bad' ? 'cell-bad' : val === 'na' ? 'cell-na' : '';
      html += '<td class="' + cls + '">' + App.utils.cellIcon(val) + '</td>';
    }
    html += '<td>' + (App.state.activeRecord.notes[idx] || '') + '</td></tr>';
  }
  html += '</tbody></table>';
  html += '<div class="signatures"><div class="sig-line">' + (App.state.activeRecord.techSignature || 'Technician Signature') + '</div><div class="sig-line">' + (App.state.activeRecord.engSignature || 'Engineer Signature') + '</div></div>';
  html += '</body></html>';
  var w = window.open('', '_blank'); w.document.write(html); w.document.close(); setTimeout(function(){ w.print(); }, 500);
}

/* ========== ARCHIVE FUNCTIONS ========== */
function importArchive(input){ var file = input.files[0]; if(file) App.db.importJSON(file); }
function viewArchive(key){ 
  var allData = App.db.loadAll(); var r = allData[key]; if(!r) return;
  var items = App.state.inspectionItems; var parts = key.split('|');
  var month = parts[1]; var y = parseInt(month.split('-')[0],10); var m = parseInt(month.split('-')[1],10)-1;
  var days = App.utils.getDaysInMonth(y, m);
  var html = '<h3 style="color:var(--navy);margin-bottom:10px">📋 Log Details</h3><p><strong>Unit:</strong> ' + parts[0] + ' &nbsp;|&nbsp; <strong>Month:</strong> ' + month + '</p><p><strong>Technician:</strong> ' + (r.techSignature || '—') + ' &nbsp;|&nbsp; <strong>Engineer:</strong> ' + (r.engSignature || '—') + '</p><div style="overflow-x:auto;margin-top:15px"><table class="log-table"><thead><tr><th style="min-width:140px">Item</th>';
  for(var d=1; d<=days; d++) html += '<th>' + d + '</th>';
  html += '</tr></thead><tbody>';
  for(var idx=0; idx<items.length; idx++){
    html += '<tr><td class="item-col">' + items[idx] + '</td>';
    for(var dd=0; dd<days; dd++){
      var val = r.cells[idx + '|' + dd] || '';
      var cls = val === 'ok' ? 'cell-ok' : val === 'bad' ? 'cell-bad' : val === 'na' ? 'cell-na' : 'cell-empty';
      html += '<td class="' + cls + '">' + App.utils.cellIcon(val) + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table></div><button class="btn btn-primary" onclick="closeModal()" style="margin-top:15px">Close</button>';
  openModal(html);
}
function deleteArchive(key){ if(confirm('Delete this log?')){ var allData = App.db.loadAll(); delete allData[key]; App.db.saveAll(allData); showToast('🗑 Deleted'); App.ui.renderArchive(); } }
function printArchive(key){
  var allData = App.db.loadAll(); var r = allData[key]; var parts = key.split('|');
  App.state.currentUnit = parts[0];
  var month = parts[1].split('-');
  App.state.currentYear = parseInt(month[0],10); App.state.currentMonth = parseInt(month[1],10)-1;
  App.state.activeRecord = r; App.state.currentKey = key;
  App.ui.renderLog(); setTimeout(function(){ printLog(); }, 300);
}

/* ========== SETTINGS FUNCTIONS ========== */
function saveSettings(){ App.state.settings.hospitalName = document.getElementById('set-hospital').value; App.state.settings.department = document.getElementById('set-department').value; App.state.settings.lastBackup = new Date().toISOString(); App.db.saveSettings(App.state.settings); showToast('✅ Settings saved'); }
function updateTech(idx, val){ App.state.technicians[idx] = val; saveTechs(); }
function deleteTech(idx){ App.state.technicians.splice(idx, 1); saveTechs(); App.ui.renderSettings(); }
function addTech(){ App.state.technicians.push('New Tech'); saveTechs(); App.ui.renderSettings(); }
function saveTechs(){ localStorage.setItem('hvac_monthly_techs', JSON.stringify(App.state.technicians)); }
function updateUnit(idx, val){ App.state.units[idx] = val; saveUnits(); }
function deleteUnit(idx){ App.state.units.splice(idx, 1); saveUnits(); App.ui.renderSettings(); }
function addUnit(){ App.state.units.push('New Unit'); saveUnits(); App.ui.renderSettings(); }
function saveUnits(){ localStorage.setItem('hvac_monthly_units', JSON.stringify(App.state.units)); }
function updateItem(idx, val){ App.state.inspectionItems[idx] = val; saveItems(); }
function deleteItem(idx){ App.state.inspectionItems.splice(idx, 1); saveItems(); App.ui.renderSettings(); }
function addItem(){ App.state.inspectionItems.push('New Item'); saveItems(); App.ui.renderSettings(); }
function saveItems(){ localStorage.setItem('hvac_monthly_items', JSON.stringify(App.state.inspectionItems)); }
function confirmClearAll(){ if(confirm('⚠️ Delete ALL data? This cannot be undone.')){ localStorage.removeItem('hvac_monthly_logs'); localStorage.removeItem('hvac_monthly_draft'); showToast('🗑 All data cleared'); App.ui.renderArchive(); } }

/* ========== INIT ========== */
function initApp(){
  // Load settings
  var saved = App.db.loadSettings();
  if(Object.keys(saved).length) App.state.settings = Object.assign({}, App.state.settings, saved);
  // Load custom lists
  var techs = JSON.parse(localStorage.getItem('hvac_monthly_techs') || 'null');
  if(techs) App.state.technicians = techs;
  var units = JSON.parse(localStorage.getItem('hvac_monthly_units') || 'null');
  if(units) App.state.units = units;
  var items = JSON.parse(localStorage.getItem('hvac_monthly_items') || 'null');
  if(items) App.state.inspectionItems = items;
  // Restore draft
  var draft = App.db.loadDraft();
  if(draft){
    App.state.currentUnit = draft.currentUnit || '';
    App.state.currentMonth = (draft.currentMonth !== undefined) ? draft.currentMonth : App.state.currentMonth;
    App.state.currentYear = (draft.currentYear !== undefined) ? draft.currentYear : App.state.currentYear;
    App.db.clearDraft();
  }
  updateClock();
  App.ui.renderLog();
}
initApp();
</script>
