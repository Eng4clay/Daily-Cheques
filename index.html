<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC Monthly Log — Cloud</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--navy:#0F2A47;--steel:#2C5F8A;--light:#DCE8F2;--green:#D9F2E1;--gtext:#1E7145;--amber:#FFF1CC;--atext:#B8860B;--red:#FBE0E2;--rtext:#B23A48;--gray:#F4F6F8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,Arial,sans-serif;background:var(--gray);color:var(--navy);display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--navy);color:#fff;padding:20px;position:fixed;top:0;left:0;bottom:0;z-index:10}
.sidebar img{width:70px;height:70px;border-radius:50%;display:block;margin:0 auto 10px;background:#fff;padding:3px}
.sidebar h3{text-align:center;font-size:14px;color:var(--light);margin-bottom:20px}
.sidebar button{display:block;width:100%;padding:12px;background:transparent;border:none;color:var(--light);font-size:15px;cursor:pointer;text-align:left;margin-bottom:5px;border-radius:6px}
.sidebar button.active{background:var(--steel);color:#fff}
.main{margin-left:220px;padding:20px;flex:1}
.card{background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:20px;margin-bottom:20px}
.card h2{font-size:18px;color:var(--steel);margin-bottom:15px;border-bottom:2px solid var(--light);padding-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:15px}
.grid label{font-weight:600;font-size:13px;color:var(--steel);display:block;margin-bottom:5px}
.grid select,.grid input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--navy);color:#fff;padding:8px;border:1px solid #333;text-align:center}
td{border:1px solid #ccc;text-align:center;height:32px;cursor:pointer}
.item-col{text-align:right;padding:0 8px;font-weight:600;background:var(--light);cursor:default;white-space:nowrap}
.ok{background:var(--green);color:var(--gtext);font-weight:700}
.bad{background:var(--red);color:var(--rtext);font-weight:700}
.na{background:var(--amber);color:var(--atext);font-weight:700}
.notes-in{width:100%;height:100%;border:none;padding:2px;font-size:10px;background:transparent;text-align:center}
.gen-notes{margin-top:15px}
.gen-notes textarea{width:100%;min-height:70px;padding:10px;border:2px dashed #ccc;border-radius:6px;font-size:14px}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-top:15px}
.sig div{border-top:1px solid #000;padding-top:8px;text-align:center;font-size:12px;font-weight:600}
.btns{margin-top:15px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 20px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
.save{background:var(--gtext);color:#fff}.print{background:var(--steel);color:#fff}.reset{background:var(--atext);color:#fff}.del{background:var(--rtext);color:#fff}
.archive-table{width:100%;border-collapse:collapse}
.archive-table th{background:var(--navy);color:#fff;padding:10px;text-align:left}
.archive-table td{padding:10px;border-bottom:1px solid #ddd;font-size:13px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:15px 25px;border-radius:6px;z-index:999;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@media print{.sidebar,.btns,.toast{display:none!important}.main{margin:0;padding:0}body{background:#fff}@page{size:A4 landscape;margin:8mm}}
</style>
</head>
<body>

<div class="sidebar">
  <img src="https://alhqyq.com/contents/newsm/18346_0.jpg" alt="Logo">
  <h3>Abu Arish General Hospital</h3>
  <button class="active" onclick="tab('log')">📋 Monthly Log</button>
  <button onclick="tab('archive')">📁 Archive</button>
  <button onclick="tab('dashboard')">📊 Dashboard</button>
</div>

<div class="main" id="main"></div>
<div class="toast" id="toast" style="display:none"></div>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDZpM6FTMaJNpG6HUL7Mag66smEt7IyJSo",
  authDomain: "hvac-abuarish-a3940.firebaseapp.com",
  databaseURL: "https://hvac-abuarish-a3940-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hvac-abuarish-a3940",
  storageBucket: "hvac-abuarish-a3940.firebasestorage.app",
  messagingSenderId: "817940058987",
  appId: "1:817940058987:web:6e45990789439101ba722e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const UNITS = ['I.C.U ROOM-PY100','I.C.U-CY240','I.C.U NEW-CTX025','O.R-1-CTX050','O.R-2-CTX050','O.R CENTRAL-LDX040','O.R-1 CORRIDOR-CTX030','MEDICAL GAS-CY100','X-RAY-CY240','X-RAY-CY240 (2)','LAB-CTX040','PHARMACY-PTX100','PHARMACY 1ST FL-PTX016','OLD E.R-PRX050','F.M.E.R-PTX030','M.E.R-PTX030','O.P.D NEW-CTX016','D.R NEW-CTX030','CSSD-CTX030','PEDIA-PTX050','CORRIDOR-PS300','F.W-PRX050','M.W-PRX050','DIRECTOR (NEW)-CTX070','LAUNDRY-CY300','MEDICAL STORE (1)-PY340','MEDICAL STORE (2)-PY340','MEDICAL STORE (3)-CTX030','MEDICAL STORE (4)-PY340'];
const TECHS = ['Najam-ud-Din Zakirullah','Arshad Hussain Dilshad','Mohammad Zafar Saleek','Imam Bahai','Danish','Jaffar','Mumtaz Afi Sheikh'];
const ITEMS = ['Condenser Coils','Freon Leakage','Thermostat','Compressor (1)','Compressor (2)','Contactor','Condenser Fan Motor','Blower Motor','Blower Belt','Filter Dryer','Pressure Switch LP/HP','Vibration Isolator','Electrical Wiring','Duct Insulation','Unit Cleanliness','Drainage System'];
const ICONS = {ok:'✓', bad:'✗', na:'N/A'};
const CYCLE = ['', 'ok', 'bad', 'na'];

let currentUnit = '', currentMonth = new Date().getMonth(), currentYear = new Date().getFullYear();
let currentCells = {}, currentNotes = {}, generalNotesText = '', currentTech = '', currentEng = '';
let currentKey = '';

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 2500);
}

async function loadAll(){
  try{
    const snap = await db.ref('logs').once('value');
    return snap.val() || {};
  } catch(e) {
    toast('⚠️ Firebase read error');
    return JSON.parse(localStorage.getItem('hvac_logs')||'{}');
  }
}

async function saveAll(data){
  try{
    await db.ref('logs').set(data);
    localStorage.setItem('hvac_logs', JSON.stringify(data));
    toast('☁️ Saved to cloud');
  } catch(e) {
    toast('❌ Save failed: ' + e.message);
  }
}

function tab(t){
  document.querySelectorAll('.sidebar button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(t==='log') renderLog();
  if(t==='archive') renderArchive();
  if(t==='dashboard') renderDashboard();
}

async function renderLog(){
  const days = new Date(currentYear, currentMonth+1, 0).getDate();
  currentKey = `${currentUnit}|${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  const all = await loadAll();
  const r = all[currentKey] || {};
  currentCells = r.cells || {};
  currentNotes = r.notes || {};
  generalNotesText = r.generalNotes || '';
  currentTech = r.tech || '';
  currentEng = r.eng || '';

  let h = `<div class="card"><h2>📋 Monthly Maintenance Log</h2><div class="grid">`;
  h += `<div><label>Month</label><input type="month" value="${currentYear}-${String(currentMonth+1).padStart(2,'0')}" onchange="monthChange(this.value)"></div>`;
  h += `<div><label>AC Unit</label><select onchange="unitChange(this.value)"><option value="">-- Select --</option>`;
  UNITS.forEach(u=>h += `<option ${u===currentUnit?'selected':''}>${u}</option>`);
  h += `</select></div>`;
  h += `<div><label>Technician</label><select onchange="techChange(this.value)"><option value="">-- Select --</option>`;
  TECHS.forEach(t=>h += `<option ${t===currentTech?'selected':''}>${t}</option>`);
  h += `</select></div>`;
  h += `<div><label>Engineer</label><select onchange="engChange(this.value)"><option value="">-- Select --</option><option ${currentEng==='Eng. Ahmad Ali Bokar Nasib'?'selected':''}>Eng. Ahmad Ali Bokar Nasib</option></select></div>`;
  h += `</div>`;

  h += `<table><thead><tr><th style="min-width:160px">INSPECTION ITEM</th>`;
  for(let d=1; d<=days; d++) h += `<th>${d}</th>`;
  h += `<th style="min-width:120px">NOTES</th></tr></thead><tbody>`;
  ITEMS.forEach((item, idx)=>{
    h += `<tr><td class="item-col">${item}</td>`;
    for(let d=0; d<days; d++){
      const ck = `${idx}|${d}`;
      const val = currentCells[ck]||'';
      const cls = val==='ok'?'ok':val==='bad'?'bad':val==='na'?'na':'';
      h += `<td class="${cls}" onclick="cellClick(this,'${ck}')">${ICONS[val]||''}</td>`;
    }
    h += `<td><input class="notes-in" value="${currentNotes[idx]||''}" oninput="noteInput(this,${idx})"></td></tr>`;
  });
  h += `</tbody></table>`;
  h += `<div class="gen-notes"><label><strong>📝 General Notes</strong></label><textarea oninput="generalInput(this)">${generalNotesText}</textarea></div>`;
  h += `<div class="sig"><div>${currentTech||'Technician Signature'}</div><div>${currentEng||'Engineer Signature'}</div></div>`;
  h += `<div class="btns"><button class="save" onclick="saveLog()">💾 Save</button><button class="print" onclick="printLog()">🖨️ Print</button><button class="reset" onclick="resetGrid()">🔄 Reset</button></div></div>`;
  document.getElementById('main').innerHTML = h;
}

function cellClick(td, ck){
  const cur = currentCells[ck]||'';
  const nextIdx = (CYCLE.indexOf(cur)+1)%CYCLE.length;
  const next = CYCLE[nextIdx];
  currentCells[ck] = next;
  td.className = next==='ok'?'ok':next==='bad'?'bad':next==='na'?'na':'';
  td.textContent = ICONS[next]||'';
}

function noteInput(input, idx){ currentNotes[idx] = input.value; }
function generalInput(ta){ generalNotesText = ta.value; }
function monthChange(v){ if(v){ const [y,m]=v.split('-').map(Number); currentYear=y; currentMonth=m-1; renderLog(); } }
function unitChange(v){ currentUnit=v; renderLog(); }
function techChange(v){ currentTech=v; }
function engChange(v){ currentEng=v; }

async function saveLog(){
  if(!currentUnit){ toast('⚠️ Select unit first'); return; }
  const all = await loadAll();
  all[currentKey] = { cells:currentCells, notes:currentNotes, generalNotes:generalNotesText, tech:currentTech, eng:currentEng };
  await saveAll(all);
}

function resetGrid(){
  if(confirm('Clear?')){
    currentCells={}; currentNotes={}; generalNotesText='';
    renderLog();
  }
}

function printLog(){
  const days = new Date(currentYear, currentMonth+1, 0).getDate();
  let w = window.open('', '_blank');
  let h = `<html><head><title>Print</title><style>body{font-family:Georgia;padding:15px}.ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;margin-bottom:15px}.ph img{width:60px;height:60px;border-radius:50%}table{border-collapse:collapse;font-size:9px;width:100%}th,td{border:1px solid #000;padding:3px;text-align:center}.item-col{text-align:right;font-weight:bold}@page{size:A4 landscape;margin:8mm}</style></head><body>`;
  h += `<div class="ph"><img src="https://alhqyq.com/contents/newsm/18346_0.jpg"><div style="text-align:center"><h2>Abu Arish General Hospital</h2><h3>MONTHLY HVAC MAINTENANCE LOG</h3></div><div>Unit: ${currentUnit}<br>${currentYear}-${String(currentMonth+1).padStart(2,'0')}</div></div>`;
  h += `<table><thead><tr><th>ITEM</th>`;
  for(let d=1; d<=days; d++) h += `<th>${d}</th>`;
  h += `<th>NOTES</th></tr></thead><tbody>`;
  ITEMS.forEach((item, idx)=>{
    h += `<tr><td class="item-col">${item}</td>`;
    for(let d=0; d<days; d++){
      const ck = `${idx}|${d}`;
      h += `<td>${ICONS[currentCells[ck]||'']||''}</td>`;
    }
    h += `<td>${currentNotes[idx]||''}</td></tr>`;
  });
  h += `</tbody></table>`;
  h += `<p><strong>General Notes:</strong> ${generalNotesText||'—'}</p>`;
  h += `</body></html>`;
  w.document.write(h); w.document.close(); setTimeout(()=>w.print(),500);
}

async function renderArchive(){
  const all = await loadAll();
  const keys = Object.keys(all);
  let h = `<div class="card"><h2>📁 Archive</h2>`;
  if(keys.length===0){ h += `<p>No saved logs.</p></div>`; }
  else {
    h += `<table class="archive-table"><thead><tr><th>Unit</th><th>Month</th><th>Tech</th><th>Eng</th><th>Actions</th></tr></thead><tbody>`;
    keys.forEach(k=>{
      const r = all[k];
      const [unit, month] = k.split('|');
      h += `<tr><td>${unit}</td><td>${month}</td><td>${r.tech||'—'}</td><td>${r.eng||'—'}</td><td>`;
      h += `<button class="btn" onclick="viewLog('${k}')">👁</button> <button class="btn del" onclick="delLog('${k}')">🗑</button></td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  document.getElementById('main').innerHTML = h;
}

async function viewLog(k){
  const all = await loadAll();
  const r = all[k]; if(!r) return;
  const [unit, month] = k.split('|');
  const days = new Date(parseInt(month.split('-')[0]), parseInt(month.split('-')[1]), 0).getDate();
  let h = `<div class="card"><h2>📋 Log Details</h2><p>Unit: ${unit} | Month: ${month} | Tech: ${r.tech||'—'} | Eng: ${r.eng||'—'}</p>`;
  h += `<table><thead><tr><th>ITEM</th>`;
  for(let d=1; d<=days; d++) h += `<th>${d}</th>`;
  h += `</tr></thead><tbody>`;
  ITEMS.forEach((item, idx)=>{
    h += `<tr><td class="item-col">${item}</td>`;
    for(let d=0; d<days; d++){
      const ck = `${idx}|${d}`;
      const val = (r.cells||{})[ck]||'';
      h += `<td class="${val==='ok'?'ok':val==='bad'?'bad':val==='na'?'na':''}">${ICONS[val]||''}</td>`;
    }
    h += `</tr>`;
  });
  h += `</tbody></table>`;
  if(r.generalNotes) h += `<p><strong>General Notes:</strong> ${r.generalNotes}</p>`;
  h += `</div>`;
  document.getElementById('main').innerHTML = h;
}

async function delLog(k){
  if(confirm('Delete?')){
    const all = await loadAll();
    delete all[k];
    await saveAll(all);
    renderArchive();
  }
}

async function renderDashboard(){
  const all = await loadAll();
  const keys = Object.keys(all);
  const mk = `${currentUnit}|${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  const cur = all[mk];
  let filled = 0;
  if(cur && cur.cells){ for(const c in cur.cells){ if(cur.cells[c]) filled++; } }
  const days = new Date(currentYear, currentMonth+1, 0).getDate();
  const pct = Math.round((filled/(ITEMS.length*days))*100);
  let h = `<div class="card"><h2>📊 Dashboard</h2><div class="grid">`;
  h += `<div style="background:#fff;padding:15px;border-radius:6px;text-align:center"><h3>${keys.length}</h3><p>Total Logs</p></div>`;
  h += `<div style="background:#fff;padding:15px;border-radius:6px;text-align:center"><h3>${filled}</h3><p>Cells Filled</p></div>`;
  h += `<div style="background:#fff;padding:15px;border-radius:6px;text-align:center"><h3>${UNITS.length}</h3><p>Units</p></div>`;
  h += `<div style="background:#fff;padding:15px;border-radius:6px;text-align:center"><h3>${pct}%</h3><p>Completion</p></div>`;
  h += `</div></div>`;
  document.getElementById('main').innerHTML = h;
}

renderLog();
</script>
</body>
</html>
