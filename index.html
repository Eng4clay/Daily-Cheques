<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC Monthly Maintenance Log — Cloud Sync</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--navy:#0F2A47;--steel:#2C5F8A;--light-blue:#DCE8F2;--gold:#B8860B;--green-bg:#D9F2E1;--green-text:#1E7145;--amber-bg:#FFF1CC;--amber-text:#B8860B;--red-bg:#FBE0E2;--red-text:#B23A48;--gray:#F4F6F8;--white:#FFFFFF;--shadow:0 2px 8px rgba(0,0,0,0.08);--radius:6px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--gray);color:var(--navy);min-height:100vh;display:flex}
.sidebar{width:240px;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;padding:0}
.sidebar-logo{padding:20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#fff;padding:3px}
.sidebar-logo h3{font-size:14px;margin-top:8px;color:var(--light-blue)}
.sidebar-nav{flex:1;padding:15px 0}
.sidebar-nav button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;background:transparent;border:none;color:var(--light-blue);font-size:15px;cursor:pointer;text-align:left}
.sidebar-nav button.active{background:var(--steel);color:#fff;border-left:4px solid var(--gold)}
.sidebar-nav button .nav-icon{font-size:18px;min-width:24px}
.sidebar-footer{padding:15px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:var(--light-blue);text-align:center}
.main-content{flex:1;margin-left:240px;padding:20px;min-height:100vh}
.app-header{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.app-header h1{font-size:22px;color:var(--navy)}.app-header p{font-size:13px;color:var(--steel)}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card-title{font-size:16px;font-weight:700;color:var(--steel);margin-bottom:15px;border-bottom:2px solid var(--light-blue);padding-bottom:10px}
.btn{padding:10px 20px;border-radius:var(--radius);border:none;font-size:14px;font-weight:600;cursor:pointer;margin-right:10px}
.btn-success{background:var(--green-text);color:#fff}.btn-primary{background:var(--steel);color:#fff}.btn-warning{background:var(--amber-text);color:#fff}.btn-danger{background:var(--red-text);color:#fff}.btn-outline{background:transparent;border:1px solid var(--steel);color:var(--steel)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.form-group label{display:block;font-weight:600;margin-bottom:5px;font-size:13px;color:var(--steel)}
.form-group select,.form-group input{width:100%;padding:10px;border:1px solid #ccc;border-radius:var(--radius);font-size:14px}
.log-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.log-table th{background:var(--navy);color:#fff;padding:8px 4px;text-align:center;font-size:11px;border:1px solid #333}
.log-table td{border:1px solid #ccc;padding:0;text-align:center;height:36px;cursor:pointer;font-size:14px}
.log-table .item-col{text-align:right;padding:0 10px;font-size:12px;font-weight:600;background:var(--light-blue);cursor:default;white-space:nowrap}
.log-table .notes-col{min-width:120px;padding:0}
.log-table .notes-col input{width:100%;height:100%;border:none;padding:5px;font-size:11px;text-align:center;background:transparent}
.cell-empty{background:#fff}.cell-ok{background:var(--green-bg);color:var(--green-text);font-weight:700}.cell-bad{background:var(--red-bg);color:var(--red-text);font-weight:700}.cell-na{background:var(--amber-bg);color:var(--amber-text);font-weight:700}
.signatures{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:20px}
.signature-box{border-top:1px solid #000;padding-top:8px;text-align:center;font-size:13px;font-weight:600}
.general-notes{margin-top:20px}
.general-notes textarea{width:100%;min-height:80px;padding:12px;border:2px dashed #ccc;border-radius:var(--radius);font-size:14px}
.archive-table{width:100%;border-collapse:collapse;font-size:13px}.archive-table th{background:var(--navy);color:#fff;padding:10px;text-align:left}.archive-table td{padding:10px;border-bottom:1px solid #ddd}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.kpi-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center}.kpi-card h2{font-size:30px;color:var(--navy)}
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.unit-card{padding:12px;border-radius:var(--radius);border:2px solid #e0e0e0;background:#fff}.unit-card.green{border-color:var(--green-text)}.unit-card.amber{border-color:var(--amber-text)}.unit-card.red{border-color:var(--red-text)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:1000}.modal-overlay.active{display:flex}.modal{background:#fff;border-radius:var(--radius);padding:25px;max-width:800px;width:90%;max-height:80vh;overflow:auto}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999}.toast{background:var(--navy);color:#fff;padding:14px 20px;border-radius:var(--radius);margin-top:10px;font-size:14px}
.legend{display:flex;gap:20px;margin-bottom:15px;font-size:12px}.legend-box{width:18px;height:18px;border:1px solid #ccc;border-radius:3px;display:inline-block}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="https://alhqyq.com/contents/newsm/18346_0.jpg" alt="شعار">
    <h3>Abu Arish General Hospital</h3>
  </div>
  <nav class="sidebar-nav">
    <button class="active" onclick="switchTab('log')"><span class="nav-icon">📋</span> Monthly Log</button>
    <button onclick="switchTab('archive')"><span class="nav-icon">📁</span> Archive</button>
    <button onclick="switchTab('dashboard')"><span class="nav-icon">📊</span> Dashboard</button>
    <button onclick="switchTab('settings')"><span class="nav-icon">⚙</span> Settings</button>
  </nav>
  <div class="sidebar-footer">HVAC Dept<br>Version 5.1</div>
</aside>

<main class="main-content">
  <header class="app-header">
    <h1>HVAC Monthly Maintenance Log</h1>
    <p>Abu Arish General Hospital</p>
  </header>
  <div id="tab-log" class="tab-content active"></div>
  <div id="tab-archive" class="tab-content"></div>
  <div id="tab-dashboard" class="tab-content"></div>
  <div id="tab-settings" class="tab-content"></div>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>

<script>
/* ========== FIREBASE ========== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDZpM6FTMaJNpG6HUL7Mag66smEt7IyJSo",
  authDomain: "hvac-abuarish-a3940.firebaseapp.com",
  databaseURL: "https://hvac-abuarish-a3940-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hvac-abuarish-a3940",
  storageBucket: "hvac-abuarish-a3940.firebasestorage.app",
  messagingSenderId: "817940058987",
  appId: "1:817940058987:web:6e45990789439101ba722e"
};
let db = null, fbConnected = false;
try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); fbConnected = true; } catch(e) { console.warn(e); }

/* ========== DATA ========== */
const UNITS = ['I.C.U ROOM-PY100','I.C.U-CY240','I.C.U NEW-CTX025','O.R-1-CTX050','O.R-2-CTX050','O.R CENTRAL-LDX040','O.R-1 CORRIDOR-CTX030','MEDICAL GAS-CY100','X-RAY-CY240','X-RAY-CY240 (2)','LAB-CTX040','PHARMACY-PTX100','PHARMACY 1ST FL-PTX016','OLD E.R-PRX050','F.M.E.R-PTX030','M.E.R-PTX030','O.P.D NEW-CTX016','D.R NEW-CTX030','CSSD-CTX030','PEDIA-PTX050','CORRIDOR-PS300','F.W-PRX050','M.W-PRX050','DIRECTOR (NEW)-CTX070','LAUNDRY-CY300','MEDICAL STORE (1)-PY340','MEDICAL STORE (2)-PY340','MEDICAL STORE (3)-CTX030','MEDICAL STORE (4)-PY340'];
const TECHS = ['Najam-ud-Din Zakirullah','Arshad Hussain Dilshad','Mohammad Zafar Saleek','Imam Bahai','Danish','Jaffar','Mumtaz Afi Sheikh'];
const ITEMS = ['Condenser Coils','Freon Leakage','Thermostat','Compressor (1)','Compressor (2)','Contactor','Condenser Fan Motor','Blower Motor','Blower Belt','Filter Dryer','Pressure Switch LP/HP','Vibration Isolator','Electrical Wiring','Duct Insulation','Unit Cleanliness','Drainage System'];
const CYCLE = ['', 'ok', 'bad', 'na'];
const ICONS = {ok:'✓', bad:'✗', na:'N/A'};

/* ========== CLEAN KEY ========== */
function cleanKey(k){
  return k.replace(/[\.\#\$\[\]\/]/g, '_');
}

/* ========== STATE ========== */
let currentUnit = '', currentMonth = new Date().getMonth(), currentYear = new Date().getFullYear();
let currentCells = {}, currentNotes = {}, generalNotesText = '', currentTech = '', currentEng = '', currentKey = '';

/* ========== DB FUNCTIONS ========== */
async function loadAll(){
  if(fbConnected && db){
    try {
      const snap = await db.ref('logs').once('value');
      const data = snap.val() || {};
      localStorage.setItem('hvac_logs', JSON.stringify(data));
      return data;
    } catch(e) { console.warn('FB read err:', e); }
  }
  try { return JSON.parse(localStorage.getItem('hvac_logs') || '{}'); } catch(e) { return {}; }
}
function saveAll(data){
  localStorage.setItem('hvac_logs', JSON.stringify(data));
  if(fbConnected && db){
    db.ref('logs').set(data).then(()=>console.log('☁️ Synced')).catch(err=>{
      console.error('FB write err:', err);
      showToast('❌ ' + err.message);
    });
  }
}

/* ========== UI ========== */
function switchTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.sidebar-nav button').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.sidebar-nav button')[['log','archive','dashboard','settings'].indexOf(tab)].classList.add('active');
  if(tab==='log') renderLog();
  if(tab==='archive') renderArchive();
  if(tab==='dashboard') renderDashboard();
  if(tab==='settings') renderSettings();
}
function showToast(m){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className='toast'; t.textContent=m; c.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}
function openModal(h){ document.getElementById('modal-content').innerHTML=h; document.getElementById('modal-overlay').classList.add('active'); }
function closeModal(){ document.getElementById('modal-overlay').classList.remove('active'); }
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

/* ========== RENDER LOG ========== */
async function renderLog(){
  const days = new Date(currentYear, currentMonth+1, 0).getDate();
  const rawKey = `${currentUnit}|${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  currentKey = cleanKey(rawKey);
  const all = await loadAll();
  const record = all[currentKey] || {};
  currentCells = record.cells || {};
  currentNotes = record.notes || {};
  generalNotesText = record.generalNotes || '';
  currentTech = record.tech || '';
  currentEng = record.eng || '';

  let h = '<div class="card"><div class="card-title">📋 Monthly Maintenance Log</div><div class="form-grid">';
  h += `<div class="form-group"><label>Month</label><input type="month" value="${currentYear}-${String(currentMonth+1).padStart(2,'0')}" onchange="onMonthChange(this.value)"></div>`;
  h += `<div class="form-group"><label>AC Unit</label><select onchange="onUnitChange(this.value)"><option value="">-- Select --</option>`;
  UNITS.forEach(u=>h += `<option value="${u}" ${u===currentUnit?'selected':''}>${u}</option>`);
  h += `</select></div>`;
  h += `<div class="form-group"><label>Technician</label><select onchange="onTechChange(this.value)"><option value="">-- Select --</option>`;
  TECHS.forEach(t=>h += `<option value="${t}" ${t===currentTech?'selected':''}>${t}</option>`);
  h += `</select></div>`;
  h += `<div class="form-group"><label>Engineer</label><select onchange="onEngChange(this.value)"><option value="">-- Select --</option><option value="Eng. Ahmad Ali Bokar Nasib" ${currentEng==='Eng. Ahmad Ali Bokar Nasib'?'selected':''}>Eng. Ahmad Ali Bokar Nasib</option></select></div></div>`;

  h += '<div class="legend"><span><span class="legend-box cell-ok"></span> OK</span><span><span class="legend-box cell-bad"></span> Bad</span><span><span class="legend-box cell-na"></span> N/A</span></div>';
  h += `<div style="overflow-x:auto;"><table class="log-table"><thead><tr><th style="min-width:160px">ITEM</th>`;
  for(let d=1;d<=days;d++) h += `<th>${d}</th>`;
  h += `<th style="min-width:130px">NOTES</th></tr></thead><tbody>`;
  ITEMS.forEach((item,idx)=>{
    h += `<tr><td class="item-col">${item}</td>`;
    for(let d=0;d<days;d++){
      const ck = `${idx}|${d}`;
      const val = currentCells[ck] || '';
      const cls = val==='ok'?'cell-ok':val==='bad'?'cell-bad':val==='na'?'cell-na':'cell-empty';
      h += `<td class="${cls}" data-idx="${idx}" data-day="${d}" onclick="cycleCell(this)">${ICONS[val]||''}</td>`;
    }
    h += `<td class="notes-col"><input value="${currentNotes[idx]||''}" oninput="noteChange(this,${idx})"></td></tr>`;
  });
  h += '</tbody></table></div>';
  h += '<div class="general-notes"><label>📝 General Notes</label><textarea id="general-notes" oninput="onGenNotes(this)">'+generalNotesText+'</textarea></div>';
  h += '<div class="signatures"><div class="signature-box">'+(currentTech||'Technician')+'</div><div class="signature-box">'+(currentEng||'Engineer')+'</div></div>';
  h += '<div style="margin-top:15px"><button class="btn btn-success" onclick="saveLog()">💾 Save</button><button class="btn btn-primary" onclick="printLog()">🖨️ Print</button><button class="btn btn-warning" onclick="resetGrid()">🔄 Reset</button></div></div>';
  document.getElementById('tab-log').innerHTML = h;
}

/* ========== CELLS ========== */
function cycleCell(td){
  const idx = parseInt(td.dataset.idx), day = parseInt(td.dataset.day);
  const ck = `${idx}|${day}`;
  const cur = currentCells[ck] || '';
  const nextIdx = (CYCLE.indexOf(cur)+1)%CYCLE.length;
  const next = CYCLE[nextIdx];
  currentCells[ck] = next;
  td.className = next==='ok'?'cell-ok':next==='bad'?'cell-bad':next==='na'?'cell-na':'cell-empty';
  td.textContent = ICONS[next]||'';
}
function noteChange(i,idx){ currentNotes[idx] = i.value; }
function onGenNotes(ta){ generalNotesText = ta.value; }
function onMonthChange(v){ if(v){const [y,m]=v.split('-').map(Number); currentYear=y; currentMonth=m-1; renderLog();} }
function onUnitChange(v){ currentUnit=v; renderLog(); }
function onTechChange(v){ currentTech=v; }
function onEngChange(v){ currentEng=v; }

/* ========== SAVE ========== */
async function saveLog(){
  if(!currentUnit){ alert('⚠️ Select Unit first'); return; }
  const all = await loadAll();
  all[currentKey] = { cells:currentCells, notes:currentNotes, generalNotes:generalNotesText, tech:currentTech, eng:currentEng };
  saveAll(all);
  showToast('✅ Saved');
}
function resetGrid(){
  if(confirm('Clear?')){ currentCells={}; currentNotes={}; generalNotesText=''; document.getElementById('general-notes').value=''; renderLog(); }
}

/* ========== PRINT ========== */
function printLog(){
  const days = new Date(currentYear, currentMonth+1, 0).getDate();
  const logo = 'https://alhqyq.com/contents/newsm/18346_0.jpg';
  let w = window.open('','_blank');
  let h = `<html><head><title>Print</title><style>body{font-family:Georgia;padding:15px}.ph{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:15px}.ph img{width:60px;height:60px;border-radius:50%}table{border-collapse:collapse;font-size:9px;width:100%}th,td{border:1px solid #000;padding:3px;text-align:center}.item-col{text-align:right;font-weight:bold}@page{size:A4 landscape;margin:8mm}</style></head><body>`;
  h += `<div class="ph"><img src="${logo}"><div><h2>Abu Arish General Hospital</h2><h3>MONTHLY HVAC MAINTENANCE LOG</h3></div><div>Unit: ${currentUnit}</div></div>`;
  h += `<p>Tech: ${currentTech} | Eng: ${currentEng} | ${currentYear}-${String(currentMonth+1).padStart(2,'0')}</p>`;
  h += `<table><thead><tr><th>ITEM</th>`;
  for(let d=1;d<=days;d++)h+=`<th>${d}</th>`;
  h+=`<th>NOTES</th></tr></thead><tbody>`;
  ITEMS.forEach((item,idx)=>{
    h+=`<tr><td class="item-col">${item}</td>`;
    for(let d=0;d<days;d++){const ck=`${idx}|${d}`; const v=currentCells[ck]||''; h+=`<td>${ICONS[v]||''}</td>`;}
    h+=`<td>${currentNotes[idx]||''}</td></tr>`;
  });
  h+=`</tbody></table><p><strong>General Notes:</strong> ${generalNotesText||'—'}</p></body></html>`;
  w.document.write(h); w.document.close(); setTimeout(()=>w.print(),500);
}

/* ========== ARCHIVE ========== */
async function renderArchive(){
  const all = await loadAll();
  const keys = Object.keys(all);
  let h = '<div class="card"><div class="card-title">📁 Archive</div>';
  if(keys.length===0){ h += '<p>No saved logs.</p></div>'; }
  else {
    h += '<table class="archive-table"><thead><tr><th>Unit</th><th>Month</th><th>Tech</th><th>Eng</th><th>Actions</th></tr></thead><tbody>';
    keys.forEach(k=>{
      const r = all[k];
      // تحويل المفتاح النظيف إلى الشكل الأصلي للعرض
      const displayUnit = k.replace(/_/g,'.');
      const parts = k.split('|');
      h += `<tr><td>${displayUnit}</td><td>${parts[1]||''}</td><td>${r.tech||'—'}</td><td>${r.eng||'—'}</td><td>`;
      h += `<button class="btn btn-outline" onclick="viewLog('${k}')">👁</button> <button class="btn btn-primary" onclick="printArchive('${k}')">🖨</button> <button class="btn btn-danger" onclick="deleteLog('${k}')">🗑</button></td></tr>`;
    });
    h += '</tbody></table></div>';
  }
  document.getElementById('tab-archive').innerHTML = h;
}
function viewLog(k){
  loadAll().then(all=>{
    const r = all[k]; if(!r)return;
    const days = new Date(currentYear,currentMonth+1,0).getDate();
    let h = `<h3>📋 Log</h3><p>Unit: ${k.replace(/_/g,'.')} | Tech: ${r.tech} | Eng: ${r.eng}</p><div style="overflow:auto"><table class="log-table"><thead><tr><th>ITEM</th>`;
    for(let d=1;d<=days;d++)h+=`<th>${d}</th>`;
    h+='</tr></thead><tbody>';
    ITEMS.forEach((item,idx)=>{
      h+=`<tr><td class="item-col">${item}</td>`;
      for(let d=0;d<days;d++){const v=(r.cells||{})[`${idx}|${d}`]||''; h+=`<td>${ICONS[v]||''}</td>`;}
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    if(r.generalNotes)h+=`<p><strong>General Notes:</strong> ${r.generalNotes}</p>`;
    h+='<button class="btn btn-primary" onclick="closeModal()">Close</button>';
    openModal(h);
  });
}
async function deleteLog(k){
  if(confirm('Delete?')){
    const all = await loadAll();
    delete all[k];
    saveAll(all);
    renderArchive();
    showToast('🗑 Deleted');
  }
}
function printArchive(k){
  loadAll().then(all=>{
    const r=all[k]; if(!r)return;
    currentUnit = k.split('|')[0].replace(/_/g,'.');
    currentTech = r.tech || '';
    currentEng = r.eng || '';
    currentCells = r.cells || {};
    currentNotes = r.notes || {};
    generalNotesText = r.generalNotes || '';
    currentKey = k;
    setTimeout(()=>printLog(),300);
  });
}

/* ========== DASHBOARD ========== */
async function renderDashboard(){
  const all = await loadAll();
  const keys = Object.keys(all);
  const mk = cleanKey(`${currentUnit}|${currentYear}-${String(currentMonth+1).padStart(2,'0')}`);
  const cur = all[mk];
  let filled=0;
  if(cur && cur.cells){ for(const c in cur.cells){ if(cur.cells[c]) filled++; } }
  const days = new Date(currentYear,currentMonth+1,0).getDate();
  const pct = Math.round((filled/(ITEMS.length*days))*100);
  let h = '<div class="kpi-grid">';
  h += `<div class="kpi-card"><h2>${keys.length}</h2><p>Total Logs</p></div>`;
  h += `<div class="kpi-card"><h2 style="color:var(--green-text)">${filled}</h2><p>Cells Filled</p></div>`;
  h += `<div class="kpi-card"><h2>${UNITS.length}</h2><p>Units</p></div>`;
  h += `<div class="kpi-card"><h2>${pct}%</h2><p>Completion</p></div></div>`;
  h += '<div class="card"><div class="card-title">🏢 Units Status</div><div class="units-grid">';
  UNITS.forEach(u=>{
    const uk = cleanKey(`${u}|${currentYear}-${String(currentMonth+1).padStart(2,'0')}`);
    const rec = all[uk];
    let bc='green', st='✅ OK';
    if(rec && rec.cells){ let bad=0; for(const c in rec.cells){ if(rec.cells[c]==='bad')bad++; } if(bad===0){bc='green';st='✅ OK';} else if(bad<=3){bc='amber';st='⚠️ '+bad;} else {bc='red';st='🔴 '+bad;} } else {bc='green';st='📝 Not inspected';}
    h += `<div class="unit-card ${bc}"><div class="unit-name">${u}</div><div class="unit-meta">${st}</div></div>`;
  });
  h += '</div></div>';
  document.getElementById('tab-dashboard').innerHTML = h;
}

/* ========== SETTINGS ========== */
function renderSettings(){
  document.getElementById('tab-settings').innerHTML = `<div class="card"><div class="card-title">⚙ Settings</div><p>Version 5.1 — Cloud Sync</p><button class="btn btn-danger" onclick="clearAllData()">🗑 Clear All</button></div>`;
}
function clearAllData(){
  if(confirm('⚠️ Delete ALL?')){
    localStorage.removeItem('hvac_logs');
    if(fbConnected && db){ db.ref('logs').remove(); }
    showToast('🗑 Cleared');
    renderArchive();
  }
}

/* ========== INIT ========== */
async function init(){ await renderLog(); }
init();
</script>
</body>
