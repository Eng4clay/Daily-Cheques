<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC Monthly Maintenance Log — Cloud Sync</title>

<!-- Firebase SDK v9 Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root{
  --navy:#0F2A47; --steel:#2C5F8A; --light-blue:#DCE8F2; --gold:#B8860B;
  --green-bg:#D9F2E1; --green-text:#1E7145; --amber-bg:#FFF1CC; --amber-text:#B8860B;
  --red-bg:#FBE0E2; --red-text:#B23A48; --gray:#F4F6F8; --white:#FFFFFF;
  --shadow:0 2px 8px rgba(0,0,0,0.08); --radius:6px; --transition:all .2s ease;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--gray);color:var(--navy);min-height:100vh;display:flex}
.sidebar{width:240px;background:var(--navy);color:var(--white);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:width .25s ease}
.sidebar-toggle{position:absolute;top:12px;right:12px;background:var(--steel);color:#fff;border:2px solid var(--gold);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;z-index:101}
.sidebar-logo{padding:20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#fff;padding:3px}
.sidebar-logo h3{font-size:14px;margin-top:8px;color:var(--light-blue)}
.sidebar-nav{flex:1;padding:15px 0}
.sidebar-nav button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;background:transparent;border:none;color:var(--light-blue);font-size:15px;cursor:pointer;transition:var(--transition);text-align:left;white-space:nowrap}
.sidebar-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar-nav button.active{background:var(--steel);color:#fff;border-left:4px solid var(--gold)}
.sidebar-nav button .nav-icon{font-size:18px;min-width:24px;text-align:center}
.sidebar-nav button .nav-label{transition:opacity .2s ease}
.sidebar-footer{padding:15px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:var(--light-blue);text-align:center}
.sidebar.collapsed{width:60px}
.sidebar.collapsed .sidebar-logo,.sidebar.collapsed .sidebar-footer{display:none}
.sidebar.collapsed .sidebar-nav button .nav-label{display:none}
.sidebar.collapsed .sidebar-nav button{justify-content:center;padding:14px 0}
.main-content{flex:1;margin-left:240px;padding:20px;min-height:100vh;transition:margin-left .25s ease}
.main-content.expanded{margin-left:60px}
.app-header{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.app-header h1{font-size:22px;color:var(--navy)}.app-header p{font-size:13px;color:var(--steel)}
.tab-content{display:none}.tab-content.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card-title{font-size:16px;font-weight:700;color:var(--steel);margin-bottom:15px;border-bottom:2px solid var(--light-blue);padding-bottom:10px}
.btn{padding:10px 20px;border-radius:var(--radius);border:none;font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn-primary{background:var(--steel);color:#fff}.btn-success{background:var(--green-text);color:#fff}.btn-warning{background:var(--amber-text);color:#fff}.btn-danger{background:var(--red-text);color:#fff}.btn-outline{background:transparent;border:1px solid var(--steel);color:var(--steel)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.form-group label{display:block;font-weight:600;margin-bottom:5px;font-size:13px;color:var(--steel)}
.form-group select,.form-group input{width:100%;padding:10px;border:1px solid #ccc;border-radius:var(--radius);font-size:14px}
.log-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.log-table th{background:var(--navy);color:#fff;padding:8px 4px;text-align:center;font-size:11px;font-weight:600;border:1px solid #333}
.log-table td{border:1px solid #ccc;padding:0;text-align:center;height:36px;cursor:pointer;transition:background .15s ease;font-size:14px}
.log-table td:hover{background:var(--light-blue)!important}
.log-table .item-col{text-align:right;padding:0 10px;font-size:12px;font-weight:600;background:var(--light-blue);cursor:default;white-space:nowrap}
.log-table .notes-col{min-width:120px;padding:0}
.log-table .notes-col input{width:100%;height:100%;border:none;padding:5px;font-size:11px;background:transparent;text-align:center}
.cell-empty{background:#fff}.cell-ok{background:var(--green-bg);color:var(--green-text);font-weight:700}.cell-bad{background:var(--red-bg);color:var(--red-text);font-weight:700}.cell-na{background:var(--amber-bg);color:var(--amber-text);font-weight:700}
.signatures{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:20px}
.signature-box{border-top:1px solid #000;padding-top:8px;text-align:center;font-size:13px;font-weight:600}
.general-notes{margin-top:20px}
.general-notes label{display:block;font-weight:700;margin-bottom:5px;font-size:14px;color:var(--steel)}
.general-notes textarea{width:100%;min-height:80px;padding:12px;border:2px dashed #ccc;border-radius:var(--radius);font-size:14px}
.archive-table{width:100%;border-collapse:collapse;font-size:13px}.archive-table th{background:var(--navy);color:#fff;padding:10px;text-align:left;font-size:12px}.archive-table td{padding:10px;border-bottom:1px solid #e0e0e0}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.kpi-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center}.kpi-card h2{font-size:30px;color:var(--navy)}
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.unit-card{padding:12px;border-radius:var(--radius);border:2px solid #e0e0e0;background:#fff}.unit-card.green{border-color:var(--green-text)}.unit-card.amber{border-color:var(--amber-text)}.unit-card.red{border-color:var(--red-text)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:none;justify-content:center;align-items:center}.modal-overlay.active{display:flex}.modal{background:#fff;border-radius:var(--radius);padding:25px;max-width:800px;width:90%;max-height:80vh;overflow-y:auto}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999}.toast{background:var(--navy);color:#fff;padding:14px 20px;border-radius:var(--radius);margin-top:10px;animation:slideIn .3s ease;font-size:14px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:15px;font-size:12px}.legend-box{width:18px;height:18px;border:1px solid #ccc;border-radius:3px;display:inline-block}
@media print{.sidebar,.app-header,.btn,.toast-container,#header-clock,.no-print,.sidebar-toggle{display:none!important}.main-content{margin:0;padding:0}body{background:#fff}.card{box-shadow:none;border:none;padding:0}@page{size:A4 landscape;margin:10mm}.log-table th{font-size:9px;padding:5px 2px}.log-table td{height:25px;font-size:11px}.log-table .item-col{font-size:10px;padding:0 5px}}
@media(max-width:768px){.sidebar{width:100%;height:auto;position:fixed;bottom:0;top:auto;flex-direction:row}.sidebar-logo,.sidebar-footer{display:none}.sidebar-nav{display:flex;padding:0}.sidebar-nav button{flex:1;justify-content:center;padding:10px 5px;font-size:11px;flex-direction:column}.main-content{margin-left:0;margin-bottom:60px;padding:10px}.main-content.expanded{margin-left:0}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-logo">
    <img src="https://alhqyq.com/contents/newsm/18346_0.jpg" alt="شعار تجمع جازان الصحي">
    <h3>Abu Arish General Hospital</h3>
  </div>
  <nav class="sidebar-nav">
    <button class="active" data-tab="log" onclick="switchTab('log')"><span class="nav-icon">📋</span><span class="nav-label">Monthly Log</span></button>
    <button data-tab="archive" onclick="switchTab('archive')"><span class="nav-icon">📁</span><span class="nav-label">Archive</span></button>
    <button data-tab="dashboard" onclick="switchTab('dashboard')"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></button>
    <button data-tab="settings" onclick="switchTab('settings')"><span class="nav-icon">⚙</span><span class="nav-label">Settings</span></button>
  </nav>
  <div class="sidebar-footer">HVAC Engineering & Maintenance<br>Version 5.0 — Cloud</div>
</aside>

<main class="main-content" id="main-content">
  <header class="app-header">
    <div><h1>HVAC Monthly Maintenance Log</h1><p>Engineering & Maintenance — Abu Arish General Hospital</p></div>
    <div id="header-clock" style="font-size:14px;color:var(--steel);font-weight:600;"></div>
  </header>
  <div id="tab-log" class="tab-content active"><div id="log-container">Loading...</div></div>
  <div id="tab-archive" class="tab-content"><div id="archive-container">Loading...</div></div>
  <div id="tab-dashboard" class="tab-content"><div id="dashboard-container">Loading...</div></div>
  <div id="tab-settings" class="tab-content"><div id="settings-container">Loading...</div></div>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>

<script>
/* ========== FIREBASE CONFIG ========== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDZpM6FTMaJNpG6HUL7Mag66smEt7IyJSo",
  authDomain: "hvac-abuarish-a3940.firebaseapp.com",
  databaseURL: "https://hvac-abuarish-a3940-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hvac-abuarish-a3940",
  storageBucket: "hvac-abuarish-a3940.firebasestorage.app",
  messagingSenderId: "817940058987",
  appId: "1:817940058987:web:6e45990789439101ba722e"
};

let db = null;
let fbConnected = false;

try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
  fbConnected = true;
  console.log('✅ Firebase connected');
} catch(e) {
  console.warn('❌ Firebase init error:', e);
}

/* ========== DATA ========== */
const UNITS = ['I.C.U ROOM-PY100','I.C.U-CY240','I.C.U NEW-CTX025','O.R-1-CTX050','O.R-2-CTX050','O.R CENTRAL-LDX040','O.R-1 CORRIDOR-CTX030','MEDICAL GAS-CY100','X-RAY-CY240','X-RAY-CY240 (2)','LAB-CTX040','PHARMACY-PTX100','PHARMACY 1ST FL-PTX016','OLD E.R-PRX050','F.M.E.R-PTX030','M.E.R-PTX030','O.P.D NEW-CTX016','D.R NEW-CTX030','CSSD-CTX030','PEDIA-PTX050','CORRIDOR-PS300','F.W-PRX050','M.W-PRX050','DIRECTOR (NEW)-CTX070','LAUNDRY-CY300','MEDICAL STORE (1)-PY340','MEDICAL STORE (2)-PY340','MEDICAL STORE (3)-CTX030','MEDICAL STORE (4)-PY340'];
const TECHS = ['Najam-ud-Din Zakirullah','Arshad Hussain Dilshad','Mohammad Zafar Saleek','Imam Bahai','Danish','Jaffar','Mumtaz Afi Sheikh'];
const ITEMS = ['Condenser Coils','Freon Leakage','Thermostat','Compressor (1)','Compressor (2)','Contactor','Condenser Fan Motor','Blower Motor','Blower Belt','Filter Dryer','Pressure Switch LP/HP','Vibration Isolator','Electrical Wiring','Duct Insulation','Unit Cleanliness','Drainage System'];
const CYCLE = ['', 'ok', 'bad', 'na'];
const ICONS = {ok:'✓', bad:'✗', na:'N/A'};

/* ========== STATE ========== */
let currentUnit = '';
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let currentCells = {};
let currentNotes = {};
let generalNotesText = '';
let currentTech = '';
let currentEng = '';
let currentKey = '';

/* ========== DATA FUNCTIONS (Firebase first, localStorage fallback) ========== */
async function loadAll(){
  if(fbConnected && db){
    try {
      const snapshot = await db.ref('logs').once('value');
      const data = snapshot.val() || {};
      localStorage.setItem('hvac_logs', JSON.stringify(data));
      return data;
    } catch(e) {
      console.warn('Firebase read failed, using localStorage');
    }
  }
  try {
    return JSON.parse(localStorage.getItem('hvac_logs') || '{}');
  } catch(e) {
    return {};
  }
}

function saveAll(data){
  localStorage.setItem('hvac_logs', JSON.stringify(data));
  if(fbConnected && db){
    db.ref('logs').set(data).then(()=>{
      console.log('☁️ Synced to Firebase');
    }).catch(err=>{
      console.warn('Firebase write error:', err);
    });
  }
}

/* ========== UI FUNCTIONS ========== */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('collapsed');
  document.getElementById('main-content').classList.toggle('expanded');
  localStorage.setItem('sidebar_collapsed', document.getElementById('sidebar').classList.contains('collapsed')?'1':'0');
}
function switchTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.sidebar-nav button').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelector('[data-tab="'+tab+'"]').classList.add('active');
  if(tab==='log') renderLog();
  if(tab==='archive') renderArchive();
  if(tab==='dashboard') renderDashboard();
  if(tab==='settings') renderSettings();
}
function showToast(msg){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}
function updateClock(){
  document.getElementById('header-clock').textContent = new Date().toLocaleString('en-GB',{dateStyle:'full',timeStyle:'medium'});
}
setInterval(updateClock,1000);
function openModal(html){ document.getElementById('modal-content').innerHTML=html; document.getElementById('modal-overlay').classList.add('active'); }
function closeModal(){ document.getElementById('modal-overlay').classList.remove('active'); }
document.getElementById('modal-overlay').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

/* ========== RENDER LOG ========== */
async function renderLog(){
  const days = new Date(currentYear, currentMonth+1, 0).getDate();
  currentKey = `${currentUnit}|${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  const all = await loadAll();
  const record = all[currentKey] || {};
  currentCells = record.cells || {};
  currentNotes = record.notes || {};
  generalNotesText = record.generalNotes || '';
  currentTech = record.tech || '';
  currentEng = record.eng || '';

  let h = '<div class="card"><div class="card-title">📋 Monthly Maintenance Log</div>';
  h += '<div class="form-grid">';
  h += `<div class="form-group"><label>Month</label><input type="month" value="${currentYear}-${String(currentMonth+1).padStart(2,'0')}" onchange="onMonthChange(this.value)"></div>`;
  h += `<div class="form-group"><label>AC Unit</label><select onchange="onUnitChange(this.value)"><option value="">-- Select --</option>`;
  UNITS.forEach(u=>h += `<option value="${u}" ${u===currentUnit?'selected':''}>${u}</option>`);
  h += `</select></div>`;
  h += `<div class="form-group"><label>Technician</label><select onchange="onTechChange(this.value)"><option value="">-- Select --</option>`;
  TECHS.forEach(t=>h += `<option value="${t}" ${t===currentTech?'selected':''}>${t}</option>`);
  h += `</select></div>`;
  h += `<div class="form-group"><label>Engineer</label><select onchange="onEngChange(this.value)"><option value="">-- Select --</option><option value="Eng. Ahmad Ali Bokar Nasib" ${currentEng==='Eng. Ahmad Ali Bokar Nasib'?'selected':''}>Eng. Ahmad Ali Bokar Nasib</option></select></div>`;
  h += '</div>';

  h += '<div class="legend no-print"><span><span class="legend-box cell-ok"></span> ✓ OK</span><span><span class="legend-box cell-bad"></span> ✗ Bad</span><span><span class="legend-box cell-na"></span> N/A</span><span><span class="legend-box cell-empty"></span> Empty</span></div>';
  h += `<div style="overflow-x:auto;"><table class="log-table"><thead><tr><th style="min-width:160px;">INSPECTION ITEM</th>`;
  for(let d=1; d<=days; d++) h += `<th>${d}</th>`;
  h += `<th style="min-width:130px;">NOTES</th></tr></thead><tbody>`;
  ITEMS.forEach((item, idx)=>{
    h += `<tr><td class="item-col">${item}</td>`;
    for(let d=0; d<days; d++){
      const ck = `${idx}|${d}`;
      const val = currentCells[ck] || '';
      const cls = val==='ok'?'cell-ok':val==='bad'?'cell-bad':val==='na'?'cell-na':'cell-empty';
      h += `<td class="${cls}" data-idx="${idx}" data-day="${d}" onclick="cycleCell(this)">${ICONS[val]||''}</td>`;
    }
    h += `<td class="notes-col"><input type="text" value="${currentNotes[idx]||''}" oninput="noteChange(this,${idx})"></td></tr>`;
  });
  h += '</tbody></table></div>';

  h += '<div class="general-notes"><label>📝 General Notes</label><textarea id="general-notes" oninput="onGeneralNotes(this)">'+generalNotesText+'</textarea></div>';
  h += '<div class="signatures no-print"><div class="signature-box">'+(currentTech||'Technician Signature')+'</div><div class="signature-box">'+(currentEng||'Engineer Signature')+'</div></div>';
  h += '<div class="no-print" style="display:flex;gap:10px;margin-top:15px;"><button class="btn btn-success" onclick="saveLog()">💾 Save Log</button><button class="btn btn-primary" onclick="printLog()">🖨️ Print</button><button class="btn btn-warning" onclick="resetGrid()">🔄 Reset</button></div></div>';

  document.getElementById('log-container').innerHTML = h;
}

/* ========== CELL FUNCTIONS ========== */
function cycleCell(td){
  const idx = parseInt(td.dataset.idx);
  const day = parseInt(td.dataset.day);
  const ck = `${idx}|${day}`;
  const cur = currentCells[ck] || '';
  const nextIdx = (CYCLE.indexOf(cur)+1) % CYCLE.length;
  const next = CYCLE[nextIdx];
  currentCells[ck] = next;
  td.className = next==='ok'?'cell-ok':next==='bad'?'cell-bad':next==='na'?'cell-na':'cell-empty';
  td.textContent = ICONS[next]||'';
}
function noteChange(input, idx){ currentNotes[idx] = input.value; }
function onGeneralNotes(ta){ generalNotesText = ta.value; }
function onMonthChange(v){ if(v){ const [y,m] = v.split('-').map(Number); currentYear=y; currentMonth=m-1; renderLog(); } }
function onUnitChange(v){ currentUnit=v; renderLog(); }
function onTechChange(v){ currentTech=v; }
function onEngChange(v){ currentEng=v; }

/* ========== SAVE ========== */
async function saveLog(){
  if(!currentUnit){ alert('⚠️ Please select AC Unit first'); return; }
  const all = await loadAll();
  all[currentKey] = {
    cells: currentCells,
    notes: currentNotes,
    generalNotes: generalNotesText,
    tech: currentTech,
    eng: currentEng
  };
  saveAll(all);
  showToast('✅ Log saved + Synced');
}
function resetGrid(){
  if(confirm('Clear entire grid?')){
    currentCells = {};
    currentNotes = {};
    generalNotesText = '';
    document.getElementById('general-notes').value = '';
    renderLog();
    showToast('🔄 Grid reset');
  }
}

/* ========== PRINT ========== */
function printLog(){
  if(!currentUnit){ showToast('⚠️ Select a Unit first'); return; }
  const days = new Date(currentYear, currentMonth+1, 0).getDate();
  const logo = 'https://alhqyq.com/contents/newsm/18346_0.jpg';
  let w = window.open('', '_blank');
  let html = `<html><head><title>Print</title><style>body{font-family:Georgia;padding:15px}.ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:15px}.ph img{width:60px;height:60px;border-radius:50%}table{border-collapse:collapse;font-size:9px;width:100%}th,td{border:1px solid #000;padding:3px;text-align:center}.item-col{text-align:right;font-weight:bold}@page{size:A4 landscape;margin:8mm}</style></head><body>`;
  html += `<div class="ph"><img src="${logo}"><div style="text-align:center"><h2>Abu Arish General Hospital</h2><h3>MONTHLY HVAC MAINTENANCE LOG</h3></div><div>Unit: ${currentUnit}<br>${currentYear}-${String(currentMonth+1).padStart(2,'0')}</div></div>`;
  html += `<p>Technician: ${currentTech} | Engineer: ${currentEng}</p>`;
  html += `<table><thead><tr><th>ITEM</th>`;
  for(let d=1; d<=days; d++) html += `<th>${d}</th>`;
  html += `<th>NOTES</th></tr></thead><tbody>`;
  ITEMS.forEach((item, idx)=>{
    html += `<tr><td class="item-col">${item}</td>`;
    for(let d=0; d<days; d++){
      const ck = `${idx}|${d}`;
      const val = currentCells[ck]||'';
      html += `<td>${ICONS[val]||''}</td>`;
    }
    html += `<td>${currentNotes[idx]||''}</td></tr>`;
  });
  html += `</tbody></table>`;
  html += `<p><strong>General Notes:</strong> ${generalNotesText||'—'}</p>`;
  html += `</body></html>`;
  w.document.write(html);
  w.document.close();
  setTimeout(()=>w.print(), 500);
}

/* ========== ARCHIVE ========== */
async function renderArchive(){
  const all = await loadAll();
  const keys = Object.keys(all);
  let h = '<div class="card"><div class="card-title">📁 Archive — Saved Monthly Logs</div>';
  if(keys.length===0){
    h += '<p style="text-align:center;padding:30px;color:var(--steel);">No saved logs yet.</p></div>';
  } else {
    h += '<table class="archive-table"><thead><tr><th>Unit</th><th>Month</th><th>Technician</th><th>Engineer</th><th>Actions</th></tr></thead><tbody>';
    keys.forEach(k=>{
      const r = all[k];
      const [unit, month] = k.split('|');
      h += `<tr><td>${unit}</td><td>${month}</td><td>${r.tech||'—'}</td><td>${r.eng||'—'}</td><td>`;
      h += `<button class="btn btn-outline" onclick="viewLog('${k}')">👁</button> `;
      h += `<button class="btn btn-primary" onclick="printArchive('${k}')">🖨</button> `;
      h += `<button class="btn btn-danger" onclick="deleteLog('${k}')">🗑</button></td></tr>`;
    });
    h += '</tbody></table></div>';
  }
  document.getElementById('archive-container').innerHTML = h;
}
function viewLog(k){
  loadAll().then(all=>{
    const r = all[k];
    if(!r) return;
    const [unit, month] = k.split('|');
    const days = new Date(parseInt(month.split('-')[0]), parseInt(month.split('-')[1]), 0).getDate();
    let h = `<h3>📋 Log Details</h3><p><strong>Unit:</strong> ${unit} | <strong>Month:</strong> ${month}</p>`;
    h += `<p><strong>Technician:</strong> ${r.tech||'—'} | <strong>Engineer:</strong> ${r.eng||'—'}</p>`;
    h += `<div style="overflow-x:auto;"><table class="log-table"><thead><tr><th>ITEM</th>`;
    for(let d=1; d<=days; d++) h += `<th>${d}</th>`;
    h += `</tr></thead><tbody>`;
    ITEMS.forEach((item, idx)=>{
      h += `<tr><td class="item-col">${item}</td>`;
      for(let d=0; d<days; d++){
        const val = (r.cells||{})[`${idx}|${d}`]||'';
        const cls = val==='ok'?'cell-ok':val==='bad'?'cell-bad':val==='na'?'cell-na':'cell-empty';
        h += `<td class="${cls}">${ICONS[val]||''}</td>`;
      }
      h += `</tr>`;
    });
    h += `</tbody></table></div>`;
    if(r.generalNotes) h += `<p><strong>General Notes:</strong> ${r.generalNotes}</p>`;
    h += `<button class="btn btn-primary" onclick="closeModal()">Close</button>`;
    openModal(h);
  });
}
async function deleteLog(k){
  if(confirm('Delete this log?')){
    const all = await loadAll();
    delete all[k];
    saveAll(all);
    renderArchive();
    showToast('🗑 Deleted');
  }
}
function printArchive(k){
  loadAll().then(all=>{
    const r = all[k];
    if(!r) return;
    const [unit, month] = k.split('|');
    currentUnit = unit;
    currentYear = parseInt(month.split('-')[0]);
    currentMonth = parseInt(month.split('-')[1])-1;
    currentCells = r.cells || {};
    currentNotes = r.notes || {};
    generalNotesText = r.generalNotes || '';
    currentTech = r.tech || '';
    currentEng = r.eng || '';
    currentKey = k;
    setTimeout(()=>printLog(), 300);
  });
}

/* ========== DASHBOARD ========== */
async function renderDashboard(){
  const all = await loadAll();
  const keys = Object.keys(all);
  const total = keys.length;
  const mk = `${currentUnit}|${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  const cur = all[mk];
  let filled = 0;
  if(cur && cur.cells){ for(const c in cur.cells){ if(cur.cells[c]) filled++; } }
  const totalDays = new Date(currentYear, currentMonth+1, 0).getDate();
  const pct = Math.round((filled/(ITEMS.length*totalDays))*100);

  let h = '<div class="kpi-grid">';
  h += `<div class="kpi-card"><h2>${total}</h2><p>Total Logs</p></div>`;
  h += `<div class="kpi-card"><h2 style="color:var(--green-text)">${filled}</h2><p>Cells Filled</p></div>`;
  h += `<div class="kpi-card"><h2>${UNITS.length}</h2><p>Units</p></div>`;
  h += `<div class="kpi-card"><h2>${pct}%</h2><p>Completion</p></div>`;
  h += '</div>';
  h += '<div class="card"><div class="card-title">🏢 Units Status</div><div class="units-grid">';
  UNITS.forEach(unit=>{
    const uk = `${unit}|${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
    const rec = all[uk];
    let bc = 'green', st = '✅ OK';
    if(rec && rec.cells){
      let bad = 0;
      for(const c in rec.cells){ if(rec.cells[c]==='bad') bad++; }
      if(bad===0){ bc='green'; st='✅ OK'; }
      else if(bad<=3){ bc='amber'; st='⚠️ '+bad; }
      else { bc='red'; st='🔴 '+bad; }
    } else { bc='green'; st='📝 Not inspected'; }
    h += `<div class="unit-card ${bc}"><div class="unit-name">${unit}</div><div class="unit-meta">${st}</div></div>`;
  });
  h += '</div></div>';
  document.getElementById('dashboard-container').innerHTML = h;
}

/* ========== SETTINGS ========== */
function renderSettings(){
  document.getElementById('settings-container').innerHTML = `
    <div class="card"><div class="card-title">⚙ Settings</div>
    <p><strong>Hospital:</strong> Abu Arish General Hospital</p>
    <p><strong>Version:</strong> 5.0 (Cloud Sync)</p>
    <p><strong>Storage:</strong> Firebase + LocalStorage</p>
    <div style="margin-top:15px;display:flex;gap:10px;">
      <button class="btn btn-danger" onclick="clearAllData()">🗑 Clear All Data</button>
      <button class="btn btn-primary" onclick="exportJSON()">⬇️ Export Backup</button>
    </div></div>`;
}
function clearAllData(){
  if(confirm('⚠️ Delete ALL data?')){
    localStorage.removeItem('hvac_logs');
    if(fbConnected && db){ db.ref('logs').remove(); }
    showToast('🗑 All data cleared');
    renderArchive();
  }
}
function exportJSON(){
  loadAll().then(all=>{
    const blob = new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Backup_'+new Date().toISOString().split('T')[0]+'.json';
    a.click();
    URL.revokeObjectURL(url);
  });
}

/* ========== INIT ========== */
async function init(){
  if(localStorage.getItem('sidebar_collapsed')==='1'){
    document.getElementById('sidebar').classList.add('collapsed');
    document.getElementById('main-content').classList.add('expanded');
  }
  updateClock();
  await renderLog();
}
init();
</script>
